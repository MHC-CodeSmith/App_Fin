<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BeluBank</title>
<meta name="theme-color" content="#2f7d5b">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f3f6f4; --card:#ffffff; --ink:#1d2a24; --muted:#66756d; --line:#dfe7e2;
  --brand:#2f7d5b; --brand-ink:#ffffff; --brand-soft:#e3f1ea;
  --red:#c2412d; --red-soft:#fbe9e5; --amber:#a86a00; --amber-soft:#fdf2dc;
  --blue:#2b62a8; --blue-soft:#e6eef9; --violet:#6b46c1; --violet-soft:#efe9fb; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --card:#1b2420; --ink:#e4ece7; --muted:#93a39a; --line:#2c3833;
    --brand:#5cb88f; --brand-ink:#0d1a14; --brand-soft:#1f3a2e;
    --red:#ef7a66; --red-soft:#3a201b; --amber:#e6b450; --amber-soft:#382c14;
    --blue:#7fa9e3; --blue-soft:#1c2a3d; --violet:#b39af0; --violet-soft:#2a2340; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121815; --card:#1b2420; --ink:#e4ece7; --muted:#93a39a; --line:#2c3833;
  --brand:#5cb88f; --brand-ink:#0d1a14; --brand-soft:#1f3a2e;
  --red:#ef7a66; --red-soft:#3a201b; --amber:#e6b450; --amber-soft:#382c14;
  --blue:#7fa9e3; --blue-soft:#1c2a3d; --violet:#b39af0; --violet-soft:#2a2340; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.top h1 span{color:var(--brand)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--brand-soft);color:var(--brand)}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:16px;margin:24px 0 10px}
h2 small{color:var(--muted);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .s{color:var(--muted);font-size:12px}
.kpi.red .v{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.list .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.list .row:first-child{border-top:0}
.who{flex:1 1 200px;min-width:0}
.who b{font-size:15px}
.who .meta{color:var(--muted);font-size:13px}
.amt{font-variant-numeric:tabular-nums;text-align:right;min-width:150px}
.amt b{font-size:17px}
.amt .meta{color:var(--muted);font-size:12px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 11px;border-radius:8px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.warn{color:var(--amber)}
.btn.info{color:var(--blue)}
.btn.dan{color:var(--red)}
.btn.wa{color:#1f9d55}
.btn.sm{padding:4px 8px;font-size:12px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;vertical-align:1px}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.green{background:var(--brand-soft);color:var(--brand)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.gray{background:var(--line);color:var(--muted)}
.atras{font-size:18px;line-height:1;padding:6px 12px;margin-right:-6px}
.atras[hidden]{display:none}
.anio{width:auto;padding:6px 10px;font-size:15px;font-weight:700;border-radius:10px;border:2px solid var(--brand);color:var(--brand);background:var(--brand-soft)}
.anio-res{padding:14px;margin-bottom:12px}
.anio-res h2{margin:0;font-size:20px}
.chip.violet{background:var(--violet-soft);color:var(--violet)}
.riesgo{border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:14px}
.riesgo.ok{background:var(--brand-soft);color:var(--brand)}
.riesgo.warn{background:var(--amber-soft);color:var(--amber)}
.empty{padding:18px;color:var(--muted);text-align:center}
.grp{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 6px}
.grp.red{color:var(--red)}
.loans{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.loan{padding:14px;min-width:0}
.loan .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.loan .hd b{font-size:16px}
.formula{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px;margin:10px 0;line-height:1.6}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--brand)}
.loan .nums{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;font-size:13px;color:var(--muted)}
.loan .nums b{color:var(--ink);font-variant-numeric:tabular-nums}
.loan .acts{margin-top:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600;font-size:12px}
td.n,th.n{text-align:right}
tr.paid td{color:var(--muted)}
tr.late td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.tblwrap{overflow-x:auto}
.form{padding:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}
.full{grid-column:1/-1}
.preview{padding:0 16px 16px}
.hint{color:var(--muted);font-size:13px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 10px}
.toolbar input{max-width:260px}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
dialog{border:0;border-radius:14px;padding:0;background:var(--card);color:var(--ink);width:min(560px,calc(100vw - 32px));box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog .dh{padding:16px 16px 0;font-weight:700;font-size:16px}
dialog .df{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 16px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;display:none;gap:12px;align-items:center;z-index:50}
#toast button{background:none;border:0;color:var(--brand-soft);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
.sumrow{display:flex;gap:16px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line);font-size:14px}
.sumrow b{font-variant-numeric:tabular-nums}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:600;cursor:pointer}
label.check input{width:auto}
table.edit input{padding:5px 6px;min-width:0}
table.edit input[type=number]{width:84px;text-align:right}
table.edit input[type=date]{width:140px}
.adjs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.adj{width:86px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--bg)}
.adj img,.adj .ico{width:72px;height:72px;object-fit:cover;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--muted);background:var(--line)}
.adj small{font-size:11px;color:var(--muted);max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.adj.add{justify-content:center;font-size:26px;color:var(--brand)}
.viewer img,.viewer video{max-width:100%;max-height:65vh;border-radius:8px;display:block;margin:0 auto}
.chart{padding:16px 12px 12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;height:100%}
.bval{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:3px}
.bstack{width:100%;max-width:40px;display:flex;flex-direction:column;border-radius:6px 6px 0 0;overflow:hidden}
.bstack i{display:block}
.bg{background:var(--brand)}
.bp{background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.blab{font-size:12px;color:var(--muted);margin-top:6px}
.bcol.cur .blab{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.nextbox{background:var(--bg);border-radius:10px;padding:12px;margin:12px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.nextbox b{font-size:20px;font-variant-numeric:tabular-nums}
.foot{color:var(--muted);font-size:12px;text-align:center;margin:28px 0 12px}
.av{--h:150;width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;
  background:hsl(var(--h) 60% 90%);color:hsl(var(--h) 45% 28%)}
.av.lg{width:56px;height:56px;font-size:20px}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .av{background:hsl(var(--h) 30% 24%);color:hsl(var(--h) 65% 82%)} }
:root[data-theme="dark"] .av{background:hsl(var(--h) 30% 24%);color:hsl(var(--h) 65% 82%)}
.list .row > .av{align-self:flex-start;margin-top:2px}
.link{cursor:pointer}
td .link[title]{text-decoration:underline dotted;text-underline-offset:3px}
.link:hover{text-decoration:underline}
.clientes{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
.cli{padding:14px;cursor:pointer;min-width:0;transition:border-color .15s,transform .15s}
.cli:hover{border-color:var(--brand)}
.cli:active{transform:scale(.99)}
.cli-hd{display:flex;gap:12px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.stat{border-radius:12px;padding:10px 12px;min-width:0;background:var(--bg);color:var(--ink)}
.stat .l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.stat .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .s{font-size:12px;opacity:.85;margin-top:1px}
.stat.blue{background:var(--blue-soft);color:var(--blue)}
.stat.green{background:var(--brand-soft);color:var(--brand)}
.stat.amber{background:var(--amber-soft);color:var(--amber)}
.stat.red{background:var(--red-soft);color:var(--red)}
.stat.violet{background:var(--violet-soft);color:var(--violet)}
.stat.gray{background:var(--bg);color:var(--muted)}
.ico-ayuda{cursor:pointer;padding:0;display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid currentColor;font-size:9px;opacity:.7;vertical-align:1px;margin-left:2px}
.cli .stats{grid-template-columns:repeat(3,1fr);gap:6px}
.cli .stat{padding:8px 10px}
.cli .stat .v{font-size:15px}
.refi-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:340px;overflow:auto}
.refi-item{display:flex;flex-direction:row;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;cursor:pointer;color:var(--ink);font-weight:500}
.refi-item.on{border-color:var(--brand);background:var(--brand-soft)}
.refi-item input{width:auto;flex:none}
.refi-item .hint{font-weight:400}
.fechas{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.fechas span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.fechas span.late{border-color:var(--red);color:var(--red)}
.cli-hd .chips{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.cli-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;background:var(--bg);border-radius:10px;padding:10px 12px}
.cli-nums span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.cli-nums b{font-variant-numeric:tabular-nums;font-size:15px}
.mes-nav{display:flex;align-items:center;gap:8px;margin:4px 0 14px}
.mes-nav h2{margin:0;font-size:21px;flex:1;text-align:center;text-transform:capitalize}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;margin:0 0 10px;flex-wrap:wrap}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;padding:6px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mrow{border-left:4px solid var(--line)}
.mrow.st-ok{border-left-color:var(--brand)}
.mrow.st-int{border-left-color:var(--amber)}
.mrow.st-late{border-left-color:var(--red)}
.nota-l{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;margin-top:3px}
.bar.big{height:10px;margin:14px 0 4px}
.bcol{cursor:pointer}
.bcol.sel .blab{color:var(--brand);font-weight:700}
.bcol.sel .bstack{outline:2px solid var(--brand);outline-offset:2px}
.tl{padding:14px;margin-bottom:12px}
.tl .formula{margin:8px 0}
table.hist .mes-row td{background:var(--bg);font-weight:700;text-transform:capitalize;color:var(--ink);padding-top:10px}
table.hist tfoot td{border-top:2px solid var(--line);border-bottom:0}
details.card > summary{padding:12px 14px;cursor:pointer;font-weight:600;font-size:14px}
@media (max-width:600px){
  body{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  nav{position:fixed;left:0;right:0;bottom:0;margin:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
    display:flex;flex-wrap:nowrap;gap:0;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
  nav button{flex:1;padding:12px 0;font-size:12px;min-width:0;border-radius:8px}
  #toast{bottom:calc(80px + env(safe-area-inset-bottom));max-width:calc(100vw - 24px)}
  .clientes{grid-template-columns:1fr}
  .cli .stats{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:1fr 1fr}
  .mes-nav h2{font-size:18px}
  .amt{text-align:left;min-width:0}
  .loans{grid-template-columns:1fr}
  table.edit input[type=number]{width:62px}
  table.edit input[type=date]{width:126px}
  table.edit th,table.edit td{padding:5px 4px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:10px 12px}
  .kpi .v{font-size:19px}
  main{padding:12px}
}
</style>

<body>
<header><div class="top">
  <button id="btnAtras" class="btn atras" onclick="volver()" aria-label="Volver al paso anterior" title="Volver" hidden>←</button><h1>Belu<span>Bank</span></h1><span id="nubeInd" class="hint" style="font-size:12px;font-weight:600"></span><select id="anioSel" class="anio" aria-label="Año que se muestra"></select>
  <nav id="nav">
    <button data-v="inicio" class="on">Cobros</button>
    <button data-v="clientes">Clientes</button>
    <button data-v="meses">Meses</button>
    <button data-v="prestamos">Préstamos</button>
    <button data-v="nuevo">+Nuevo</button>
    <button data-v="respaldo">Respaldo</button>
  </nav>
</div></header>
<main id="app"></main>
<dialog id="dlg"><form method="dialog" id="dlgForm"><div class="dh" id="dlgTitle"></div><div id="dlgBody"></div><div class="df"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn pri" value="ok" id="dlgOk">Guardar</button></div></form></dialog>
<div id="toast"><span id="toastMsg"></span><button id="toastUndo">Deshacer</button></div>
<input type="file" id="fileIn" accept=".json,.zip,application/json,application/zip" hidden>

<script>
/* ================= Datos ================= */
const KEY = 'financiera.v1';
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoy = () => iso(new Date());
const P = s => { const [y,m,d] = s.split('-').map(Number); return {y,m,d}; };
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = x => Math.round(x*100)/100;

function addMonths(s, k, dia){
  const p = P(s); let m = p.m - 1 + k; const y = p.y + Math.floor(m/12); m = ((m%12)+12)%12;
  const last = new Date(y, m+1, 0).getDate();
  return y+'-'+pad(m+1)+'-'+pad(Math.min(dia || p.d, last));
}
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fD(s){ if(!s) return '—'; const p = P(s); return pad(p.d)+'/'+pad(p.m)+(p.y !== new Date().getFullYear() ? '/'+p.y : ''); }
const fDa = s => { if (!s) return '—'; const p = P(s); return pad(p.d) + '/' + pad(p.m) + '/' + p.y; };
// En la tabla de un préstamo que toca otro año, todas las fechas llevan el año (para no confundir 04/01 con 04/01/2025).
const fechaFmt = cuotas => cuotas.some(c => c.fecha.slice(0,4) !== String(new Date().getFullYear())) ? fDa : fD;

/* Año en foco: lo que se ve en Clientes, Préstamos y Meses es de ese año hasta que se elija otro. */
// Al abrir la app siempre empieza en el año actual; otro año elegido vale solo mientras la app esté abierta.
let anioFoco = (() => { try { return sessionStorage.getItem('belubank.anio') || hoy().slice(0,4); } catch(e){ return hoy().slice(0,4); } })();
const enAnio = f => anioFoco === 'todos' || (!!f && f.startsWith(anioFoco));
const sufAnio = () => anioFoco === 'todos' ? '' : ' ' + anioFoco;
// Un préstamo es del año si alguna de sus cuotas vence ese año o (en el año actual) si todavía tiene cuotas pendientes.
// Todo lo que se suma por mes o por año usa la FECHA LÍMITE de la cuota, aunque el cliente haya pagado antes o después.
const prestamoEnAnio = L => anioFoco === 'todos' || enAnio(L.cuotas[0]?.fecha || L.creado)
  || L.cuotas.some(c => enAnio(c.fecha)) || (anioFoco >= hoy().slice(0,4) && L.cuotas.some(c => !c.pagado));
function pintarAnios(){
  const sel = document.getElementById('anioSel'); if (!sel) return;
  const anios = new Set([hoy().slice(0,4)]);
  S.prestamos.forEach(L => L.cuotas.forEach(c => anios.add(c.fecha.slice(0,4))));
  if (anioFoco !== 'todos') anios.add(anioFoco);
  sel.innerHTML = [...anios].sort().reverse().map(a => `<option value="${a}">${a}</option>`).join('') + '<option value="todos">Todos los años</option>';
  sel.value = anioFoco;
}
function money(x){ x = r2(x||0); return 'S/ ' + x.toLocaleString('es-PE', {minimumFractionDigits: Number.isInteger(x)?0:2, maximumFractionDigits:2}); }
const num = x => { x = r2(x||0); return Number.isInteger(x) ? String(x) : x.toFixed(2); };
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00') - new Date(a+'T00:00'))/864e5);

/* Reparte capital e interés en n cuotas: capital redondeado hacia arriba, interés hacia abajo,
   la última cuota ajusta la diferencia (así 2000*20%/3 = 667+133 = 800 cada mes). */
function split(cap, int, n){
  let c = Math.ceil(cap/n); if (c*(n-1) > cap) c = Math.floor(cap/n);
  let i = Math.floor(int/n); if (i*(n-1) > int) i = 0;
  return Array.from({length:n}, (_,k) => k < n-1 ? {capital:c, interes:i} : {capital:r2(cap-c*(n-1)), interes:r2(int-i*(n-1))});
}
function interesDe(modo, base, valor, meses){
  if (modo === 'pct') return r2(base*valor/100);
  if (modo === 'mes') return r2(valor*meses);
  return r2(valor);
}
function formulaDe(modo, base, valor, meses, intTotal, extra){
  const parts = split(base, intTotal, meses)[0];
  let f = modo === 'pct' ? `${num(base)}*${num(valor)}%` : modo === 'mes' ? `${num(base)}cap + ${num(valor)}int/mes` : `${num(base)}cap + ${num(intTotal)}int`;
  if (extra) f = extra + ' → ' + f;
  if (meses > 1) f += (modo === 'mes' ? ` x ${meses}mes` : `/${meses}mes`);
  return f + `\n${num(parts.capital)}cap+${num(parts.interes)}int=${num(parts.capital+parts.interes)}`;
}

function crearPrestamo(o){
  const intTotal = interesDe(o.modo, o.capital, o.valor, o.meses);
  let cuotas, formula = formulaDe(o.modo, o.capital, o.valor, o.meses, intTotal, o.extra);
  if (o.filas?.length){
    // Cuotas elegidas a mano: cada una con su fecha y su monto.
    cuotas = o.filas.map(f => ({id:f.id || uid(), fecha:f.fecha, capital:r2(+f.capital || 0), interes:r2(+f.interes || 0), tipo:f.tipo || 'normal',
      pagado:!!f.pagado, fechaPago:f.pagado ? (f.fechaPago || f.fecha) : null, ...(f.fijo ? {fijo:true} : {})})).sort((a,b) => a.fecha.localeCompare(b.fecha));
    formula = formula.split('\n')[0] + '\ncuotas personalizadas';
  } else {
    const dia = P(o.primera).d;
    cuotas = split(o.capital, intTotal, o.meses).map((p,k) => {
      const fecha = addMonths(o.primera, k, dia), pag = k < (o.pagadas||0);
      return {id:uid(), fecha, capital:p.capital, interes:p.interes, tipo:'normal', pagado:pag, fechaPago: pag ? fecha : null};
    });
  }
  return {id:uid(), cliente:o.cliente.trim(), fechaPrestamo:o.fechaPrestamo || '', apodo:(o.apodo||'').trim(), tel:(o.tel||'').trim(), ingreso:+o.ingreso || 0, nota:(o.nota||'').trim(),
    capital:o.capital, modo:o.modo, valor:o.valor, meses:o.meses, interesTotal:r2(cuotas.reduce((s,c) => s + c.interes, 0)), dia:P(cuotas[0]?.fecha || o.primera).d,
    formula, creado:hoy(), cuotas, adjuntos:[], eventos:[{f:hoy(), t:'Préstamo registrado'}]};
}

/* Paga solo el interés de la cuota c: queda registrado ese pago y toda la deuda pendiente se corre un mes. */
function aplicarSoloInteres(L, c, monto, fechaPago){
  const idx = L.cuotas.indexOf(c);
  L.cuotas.forEach((q,j) => { if (j >= idx && !q.pagado) q.fecha = addMonths(q.fecha, 1, L.dia); });
  L.cuotas.splice(idx, 0, {id:uid(), fecha:addMonths(c.fecha,-1,L.dia), capital:0, interes:monto, tipo:'interes', pagado:true, fechaPago});
  L.eventos.push({f:hoy(), t:`Pagó solo interés (${money(monto)}). La deuda se corrió un mes.`});
}
function deshacerSoloInteres(L, q){
  const idx = L.cuotas.indexOf(q);
  L.cuotas.splice(idx,1);
  L.cuotas.forEach((x,j) => { if (j >= idx && !x.pagado) x.fecha = addMonths(x.fecha, -1, L.dia); });
  L.eventos.push({f:hoy(), t:'Se anuló un pago de solo interés'});
}

function seed(){
  // Datos ficticios, con fechas relativas a hoy, solo para mostrar cómo funciona la app.
  const t = hoy();
  const a = crearPrestamo({cliente:'María (ejemplo)', apodo:'Mari', ingreso:2500, capital:1000, modo:'pct', valor:16, meses:2, primera:addMonths(t,0,P(t).d < 25 ? P(t).d+3 : 28), pagadas:0});

}

/* ================= Cálculos ================= */
const pendientes = L => L.cuotas.filter(c => !c.pagado);
const normales = L => L.cuotas.filter(c => c.tipo === 'normal');
function posicion(L, c){ return (L.cuotas.indexOf(c)+1) + '/' + L.cuotas.length; }
function extrasInteres(L){ return L.cuotas.filter(c => c.tipo === 'interes').length; }
/* Congelado automático: si la cuota pendiente más antigua venció hace más de N días (120 por defecto)
   y en ese tiempo no hubo ningún pago. "Descongelar" lo vuelve a activar. */
const diasCongelar = () => S.diasCongelar ?? 120;
function congeladoAuto(L){
  if (L.descongelado || !diasCongelar()) return false;
  const p = pendientes(L), t = hoy(); if (!p.length || daysBetween(p[0].fecha, t) <= diasCongelar()) return false;
  const ult = L.cuotas.filter(c => c.pagado && c.fechaPago).map(c => c.fechaPago).sort().at(-1);
  return !ult || daysBetween(ult, t) > diasCongelar();
}
const esCongelado = L => !!L.congelado || congeladoAuto(L);
// La mora no corre en préstamos congelados
let mapaCuotas = new WeakMap();
function prestamoDeCuota(c){ if (!mapaCuotas.has(c)){ mapaCuotas = new WeakMap(); S.prestamos.forEach(L => L.cuotas.forEach(q => mapaCuotas.set(q, L))); } return mapaCuotas.get(c); }
function estadoPrestamo(L){
  const p = pendientes(L);
  if (!p.length) return L.refinanciadoEn ? {t:'Refinanciado', cls:'blue'} : {t:'Pagado', cls:'green'};
  if (esCongelado(L)) return {t:'Congelado', cls:'gray'};
  if (p[0].fecha < hoy()) return {t:'Atrasado', cls:'red'};
  return {t:'Al día', cls:'blue'};
}
function mesKey(s){ return s.slice(0,7); }
// Cómo se lee una cuota: "300 cap + 129 int" o, si fue un acuerdo sin cálculo, "monto fijo 200".
const descCuota = c => c.fijo ? `monto fijo ${num(c.capital)}${c.interes ? ` + ${num(c.interes)} int` : ''}` : `${num(c.capital)} cap + ${num(c.interes)} int`;
const etiquetaTipo = c => c.fijo ? ' <span class="chip violet">monto fijo</span>' : c.tipo === 'interes' ? ' <span class="chip blue">solo int.</span>' : c.tipo === 'abono' ? ' <span class="chip violet">abono</span>'
  : c.cubierta ? ' <span class="chip violet">cubierta con abono</span>' : '';

/* Mora: S/ 5 (configurable) por cada día de atraso de una cuota. Se suma sola al registrar el pago
   (queda dentro del interés de esa cuota, como ganancia) y se puede exonerar con un botón. */
const moraDia = () => S.moraDia ?? 5;
function moraDe(c, alDia = hoy()){
  if (c.pagado || c.moraExonerada || c.tipo !== 'normal') return 0;
  const L = prestamoDeCuota(c); if (L && esCongelado(L)) return 0;
  const d = daysBetween(c.fecha, alDia);
  return d > 0 ? r2(d * moraDia()) : 0;
}
const totalHoy = c => r2(c.capital + c.interes + moraDe(c));
function chipMora(L, c){
  if (esCongelado(L) && !c.pagado) return '';
  if (c.pagado) return c.mora ? `<span class="chip amber">incl. mora ${num(c.mora)}</span> <button class="btn sm" onclick="quitarMora('${L.id}','${c.id}')">Quitar mora</button>` : '';
  if (c.tipo !== 'normal' || c.fecha >= hoy() || !moraDia()) return '';
  if (c.moraExonerada) return `<span class="chip gray">Mora exonerada</span> <button class="btn sm" onclick="exonerar('${L.id}','${c.id}')">Cobrar mora</button>`;
  const d = daysBetween(c.fecha, hoy());
  return `<span class="chip red">Mora ${money(moraDe(c))} (${d} día${d > 1 ? 's' : ''})</span> <button class="btn sm" onclick="exonerar('${L.id}','${c.id}')">Exonerar</button>`;
}

/* % de cumplimiento: de las cuotas que ya vencieron (o ya se pagaron), cuántas se pagaron
   completas y a tiempo. Un mes de "solo interés" cuenta como no cumplido. */
/* Semáforo de cada cuota (las fechas cuentan por la fecha límite):
   - A tiempo: pagó completo hasta la fecha límite.
   - Tolerancia: pagó completo hasta N días después (por defecto 3). No es incumplimiento.
   - Pagó interés: pagó solo el interés dentro de la tolerancia. Cumplió con lo importante.
   - Tarde: pagó (completo o interés) después de la tolerancia.
   - No pagó: venció hace más de N días y no pagó nada.
   Abonos, refinanciamientos y cuotas cubiertas con abono no se evalúan. */
const toleranciaDias = () => S.toleranciaDias ?? 3;
function estadoCumpl(c, t = hoy()){
  if (c.tipo === 'refi' || c.tipo === 'abono' || c.cubierta) return null;
  const tol = toleranciaDias();
  if (!c.pagado){ const d = daysBetween(c.fecha, t); return d > tol ? {k:'nopago', d} : null; }
  const d = Math.max(0, daysBetween(c.fecha, c.fechaPago || c.fecha));
  if (c.tipo === 'interes') return d > tol ? {k:'tarde', d} : {k:'interes', d};
  return d === 0 ? {k:'ok', d} : d <= tol ? {k:'tol', d} : {k:'tarde', d};
}
const SEM = {ok:{t:'A tiempo', cls:'green', peso:1}, tol:{t:'Tolerancia', cls:'green', peso:1}, interes:{t:'Pagó interés', cls:'blue', peso:0.75},
  tarde:{t:'Tarde', cls:'amber', peso:0.25}, nopago:{t:'No pagó', cls:'red', peso:0}};
function semaforo(cuotas){
  const r = {ok:0, tol:0, interes:0, tarde:0, nopago:0, n:0, pct:null};
  for (const c of cuotas){ const e = estadoCumpl(c); if (e){ r[e.k]++; r.n++; } }
  if (r.n) r.pct = Math.round(Object.keys(SEM).reduce((s, k) => s + r[k] * SEM[k].peso, 0) / r.n * 100);
  return r;
}
const cumplimiento = cuotas => semaforo(cuotas).pct;
const nivel = p => p === null ? {t:'Sin historial', cls:'gray'} : p >= 85 ? {t:'Cumple', cls:'green'} : p >= 60 ? {t:'Regular', cls:'amber'} : {t:'Riesgoso', cls:'red'};
const chipCumpl = p => { const n = nivel(p); return `<span class="chip ${n.cls}">${p === null ? n.t : `${n.t} · ${p}%`}</span>`; };
function chipEstadoCumpl(c){
  const e = estadoCumpl(c); if (!e) return '';
  const txt = e.k === 'tol' ? `+${e.d} día${e.d > 1 ? 's' : ''} (tolerancia)` : e.k === 'tarde' ? `Tarde ${e.d} días` : e.k === 'nopago' ? `No pagó (${e.d} días)` : SEM[e.k].t;
  return `<span class="chip ${SEM[e.k].cls}">${txt}</span>`;
}
const resumenSem = r => [['ok','a tiempo'],['tol','en tolerancia'],['interes','solo interés'],['tarde','tarde'],['nopago','sin pagar']].filter(([k]) => r[k]).map(([k, t]) => `${r[k]} ${t}`).join(' · ') || 'sin cuotas vencidas';
const mismoCliente = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
const prestamosDe = nombre => S.prestamos.filter(L => mismoCliente(L.cliente, nombre));
const cuotaTipica = L => { const c = L.cuotas.find(c => c.tipo === 'normal'); return c ? c.capital + c.interes : 0; };

let vista = 'inicio', filtro = '', mesHist = hoy().slice(0,7), abiertos = new Set();

/* Volver al paso anterior: se guarda cada pantalla visitada (y el botón "atrás" del celular también vuelve). */
const pila = [];
function recordar(){
  if (location.hash) return;
  const e = {vista, clienteSel, mesSel, y:window.scrollY}, top = pila.at(-1);
  if (top && top.vista === e.vista && top.clienteSel === e.clienteSel && top.mesSel === e.mesSel) return;

/* Etiqueta de cada préstamo: el mes en que empieza y, si el cliente tiene más de uno ese mes,
   su orden (julio 1º, julio 2º…). Se recalcula en cada pantalla. */
let etqCache = null;
function etiqueta(L){
  if (!etqCache){
    etqCache = new Map();
    const grupos = new Map();
    for (const x of S.prestamos.slice().sort((a, b) => (a.cuotas[0]?.fecha || a.creado).localeCompare(b.cuotas[0]?.fecha || b.creado) || porCreacion(a, b))){
      const mes = (x.cuotas[0]?.fecha || x.creado).slice(0, 7), k = claveCliente(x.cliente) + '|' + mes;
      if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(x);
    }
    for (const [k, xs] of grupos){
      const p = P(k.split('|')[1] + '-01'), mes = MESL[p.m - 1] + (String(p.y) !== hoy().slice(0, 4) ? ' ' + p.y : '');
      xs.forEach((x, i) => etqCache.set(x.id, {mes, n:xs.length > 1 ? i + 1 : 0}));
    }
  }
  return etqCache.get(L.id) || {mes:'', n:0};
}
const textoEtq = L => { const e = etiqueta(L); return e.mes + (e.n ? ` ${e.n}º` : ''); };
const chipEtq = L => { const e = etiqueta(L); return e.mes ? ` <span class="chip ${e.n ? 'violet' : 'gray'}">${textoEtq(L)}</span>` : ''; };

function filaCongelado(L){
  const p = pendientes(L), debe = r2(p.reduce((s, c) => s + c.capital + c.interes, 0));
  const ult = L.cuotas.filter(c => c.pagado && c.fechaPago).map(c => c.fechaPago).sort().at(-1);

}

function filaCobro(L, c){

      <div class="meta">Vence ${fD(c.fecha)} ${atras ? `<span class="chip red">${atras} día${atras>1?'s':''} de atraso</span>` : c.fecha===t ? '<span class="chip amber">hoy</span>' : `· faltan ${daysBetween(t,c.fecha)} días`}</div></div>
    <div class="amt"><b>${money(totalHoy(c))}</b><div class="meta">${descCuota(c)}${moraDe(c) ? ` + ${num(moraDe(c))} mora` : ''}</div></div>

}

function vInicio(){
  const t = hoy(), mes = t.slice(0,7), prox = addMonths(t,1).slice(0,7);
  const items = [];
  S.prestamos.filter(L => !esCongelado(L)).forEach(L => pendientes(L).forEach(c => items.push({L,c})));
  const congs = S.prestamos.filter(L => esCongelado(L) && pendientes(L).length).sort((a, b) => pendientes(a)[0].fecha.localeCompare(pendientes(b)[0].fecha));
  items.sort((a,b) => a.c.fecha.localeCompare(b.c.fecha));
  const atras = items.filter(x => x.c.fecha < t);
  const esteMes = items.filter(x => x.c.fecha >= t && mesKey(x.c.fecha) === mes);
  const proxMes = items.filter(x => mesKey(x.c.fecha) === prox);
  const calle = items.reduce((s,x) => s + x.c.capital, 0);
  const porInt = items.reduce((s,x) => s + x.c.interes, 0);
  const porCobrarMes = [...atras, ...esteMes].reduce((s,x) => s + x.c.capital + x.c.interes, 0);
  let cobradoMes = 0, intMes = 0;
  S.prestamos.forEach(L => L.cuotas.forEach(c => { if (c.pagado && mesKey(c.fecha) === mes){ cobradoMes += c.capital+c.interes; intMes += c.interes; }}));
  const activos = S.prestamos.filter(L => !esCongelado(L) && pendientes(L).length).length;
  const nombreMes = m => { const p = P(m+'-01'); return MESES[p.m-1]; };

  const grupo = (titulo, arr, cls) => arr.length ? `<div class="grp ${cls||''}">${titulo} · ${money(arr.reduce((s,x)=>s+totalHoy(x.c),0))}</div><div class="card list">${arr.map(x=>filaCobro(x.L,x.c)).join('')}</div>` : '';
  app.innerHTML = bannerRespaldo() + resumenAnio() + `
  <div class="kpis">
    <div class="kpi"><div class="l">Capital en la calle</div><div class="v">${money(calle)}</div><div class="s">${activos} préstamo${activos!==1?'s':''} activo${activos!==1?'s':''} · +${money(porInt)} de interés por cobrar</div></div>
    <div class="kpi"><div class="l">Por cobrar en ${nombreMes(mes)}</div><div class="v">${money(porCobrarMes)}</div><div class="s">incluye atrasados</div></div>
    <div class="kpi"><div class="l">Cobrado en ${nombreMes(mes)}</div><div class="v">${money(cobradoMes)}</div><div class="s">ganancia (interés): ${money(intMes)}</div></div>
    <div class="kpi"><div class="l">Cuotas atrasadas</div><div class="v">${atras.length}</div><div class="s">${atras.length ? money(atras.reduce((s,x)=>s+x.c.capital+x.c.interes,0))+' vencido' : 'todo en orden'}</div></div>
  </div>
  ${grupo('Este mes ('+nombreMes(mes)+')', esteMes)}
  ${grupo('Próximo mes ('+nombreMes(prox)+')', proxMes)}
  ${!esteMes.length && !proxMes.length ? '<div class="card empty" style="margin-top:16px">No hay cobros pendientes para este mes ni el próximo.</div>' : ''}
  ${atras.length || congs.length ? `<div class="toolbar" style="margin-top:18px"><span class="grp" style="margin:0">Atrasados (${atras.length})${atras.length ? ' · ' + money(atras.reduce((s,x)=>s+totalHoy(x.c),0)) : ''}${congs.length ? ` · ${congs.length} congelado${congs.length > 1 ? 's' : ''}` : ''}</span>
    <button class="btn sm" onclick="ocultarAtrasados(${!verAtrasados()})">${verAtrasados() ? 'Ocultar' : 'Mostrar'}</button></div>
    ${verAtrasados() ? `${atras.length ? `<div class="card list">${atras.map(x=>filaCobro(x.L,x.c)).join('')}</div>` : ''}
      ${congs.length ? `<div class="grp" style="margin-top:14px">Congelados · ${money(congs.reduce((s,L)=>s+pendientes(L).reduce((a,c)=>a+c.capital+c.interes,0),0))}</div>
        <div class="card list">${congs.map(filaCongelado).join('')}</div>` : ''}
      <p class="hint">Una deuda con más de ${diasCongelar()} días sin ningún pago se congela sola: no suma mora ni cuenta en los totales. También puedes congelar a mano con <b>Congelar</b> en el préstamo.</p>` : ''}` : ''}`;
}

function vPrestamos(){
  const q = filtro.toLowerCase();

function tarjeta(L){
  const e = estadoPrestamo(L), pend = pendientes(L), sig = pend[0];
  const totCap = L.cuotas.reduce((s,c)=>s+c.capital,0), pagCap = L.cuotas.filter(c=>c.pagado).reduce((s,c)=>s+c.capital,0);
  const intCobrado = L.cuotas.filter(c=>c.pagado).reduce((s,c)=>s+c.interes,0);
  const ext = extrasInteres(L), nNorm = normales(L).length, nAdj = (L.adjuntos || []).length;
  const abierto = abiertos.has(L.id);
  const todos = prestamosDe(L.cliente), cpTotal = todos.length > 1 ? cumplimiento(todos.flatMap(x => x.cuotas)) : null;
  const pctIng = L.ingreso ? Math.round(cuotaTipica(L) / L.ingreso * 100) : null;
  return `<div class="card loan">
    <div class="hd"><div style="display:flex;gap:10px;align-items:flex-start;min-width:0">${avatar(L.cliente)}<div style="min-width:0"><b class="link" onclick="irCliente('${L.id}')">${esc(L.cliente)}</b>${L.apodo ? ` <span class="hint">“${esc(L.apodo)}”</span>` : ''}${chipEtq(L)} ${L.modo==='pct' ? `<span class="hint">(${num(L.valor)}%)</span>` : ''}
      <div class="hint">${sig ? `Cuota ${posicion(L,sig)} · vence ${fD(sig.fecha)}` : 'Préstamo terminado'} · total ${L.cuotas.length}/${L.cuotas.length}${ext ? ` (${nNorm} + ${ext} solo interés)` : ''}</div></div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="chip ${e.cls}">${e.t}</span>${chipCumpl(cumplimiento(L.cuotas))}</div></div>
    <div class="formula">${esc(L.formula).replace(/\n/g,'<br>')}${sig ? ` (${fD(sig.fecha)})` : ''}</div>
    <div class="bar"><i style="width:${totCap ? Math.round(pagCap/totCap*100) : 100}%"></i></div>
    <div class="nums"><span>Capital devuelto <b>${money(pagCap)}</b> de ${money(totCap)}</span><span>Interés cobrado <b>${money(intCobrado)}</b></span></div>
    ${cpTotal !== null ? `<div class="hint" style="margin-top:6px">Cumplimiento con todos sus préstamos (${todos.length}): <b>${cpTotal}%</b></div>` : ''}
    ${L.ingreso ? `<div class="hint" style="margin-top:6px">Gana ${money(L.ingreso)} al mes · la cuota es el <b style="color:var(--${pctIng > 40 ? 'red' : pctIng > 25 ? 'amber' : 'brand'})">${pctIng}%</b> de su ingreso</div>` : ''}
    ${L.tel ? `<div class="hint" style="margin-top:6px">Tel. ${esc(L.tel)}</div>` : ''}
    ${L.nota ? `<div class="hint" style="margin-top:6px">Nota: ${esc(L.nota)}</div>` : ''}
    <div class="acts">
      <button class="btn" onclick="toggle('${L.id}')">${abierto ? 'Ocultar' : 'Ver cuotas'}${nAdj ? ` · ${nAdj} archivo${nAdj > 1 ? 's' : ''}` : ''}</button>
      <button class="btn wa" onclick="enviarEstado('${L.id}')">Enviar estado</button>
      <button class="btn" onclick="corregir('${L.id}')">Corregir</button>
      ${pend.length ? `<button class="btn" onclick="dlgAbono('${L.id}')">Abono</button><button class="btn warn" onclick="refinanciar('${L.id}')">Refinanciar</button><button class="btn" onclick="congelar('${L.id}')">${esCongelado(L) ? 'Descongelar' : 'Congelar'}</button>` : ''}
      <button class="btn dan" onclick="eliminar('${L.id}')">Eliminar</button>
    </div>
    ${abierto ? tablaCuotas(L) + panelAdjuntos(L) : ''}
  </div>`;
}
function toggle(id){ abiertos.has(id) ? abiertos.delete(id) : abiertos.add(id); render(); }

function tablaCuotas(L){
  const fx = fechaFmt(L.cuotas);
  const t = hoy();
  return `<div class="tblwrap" style="margin-top:12px"><table><thead><tr><th>#</th><th>Fecha límite</th><th class="n">Cap.</th><th class="n">Int.</th><th class="n">Total</th><th>Estado</th><th></th></tr></thead><tbody>
  ${L.cuotas.map((c,i) => {
    const late = !c.pagado && c.fecha < t;
    const est = c.tipo === 'refi' ? `<span class="chip blue">Refinanciado · ${money(c.movido || 0)} pasó al nuevo préstamo</span>` : (c.pagado ? `<span class="chip green">Pagado ${fx(c.fechaPago)}</span>` : late ? '<span class="chip red">Atrasado</span>' : '<span class="chip gray">Pendiente</span>') + (chipMora(L, c) ? ' ' + chipMora(L, c) : '');
    const acc = (c.tipo === 'refi' ? '' : c.tipo === 'abono' ? `<button class="btn sm" onclick="anularAbono('${L.id}','${c.id}')">Anular</button>` : c.tipo === 'interes'
      ? `<button class="btn sm" onclick="anularInteres('${L.id}','${c.id}')">Anular</button>`
      : c.pagado ? (c.cubierta ? '' : `<button class="btn sm" onclick="despagar('${L.id}','${c.id}')">Deshacer</button> <button class="btn sm" onclick="dlgCuota('${L.id}','${c.id}')">✎</button>`)
      : `<button class="btn sm pri" onclick="pagar('${L.id}','${c.id}')">Pagó</button> <button class="btn sm" onclick="dlgCuota('${L.id}','${c.id}')">✎</button>`)
      + (c.tipo === 'abono' ? '' : ` <button class="btn sm dan" onclick="borrarCuota('${L.id}','${c.id}')" title="Borrar cuota">✕</button>`);
    return `<tr class="${c.pagado?'paid':''} ${late?'late':''}"><td>${i+1}${etiquetaTipo(c)}</td><td>${fx(c.fecha)}</td><td class="n">${num(c.capital)}</td><td class="n">${num(c.interes)}</td><td class="n"><b>${num(c.capital+c.interes)}</b></td><td>${est}</td><td style="white-space:nowrap">${acc}</td></tr>`;
  }).join('')}</tbody></table></div>
  ${L.eventos?.length ? `<details style="margin-top:8px"><summary class="hint" style="cursor:pointer">Historial del préstamo (${L.eventos.length})</summary><ul class="hint">${L.eventos.map(e=>`<li>${fx(e.f)} — ${esc(e.t)}</li>`).join('')}</ul></details>` : ''}`;
}

/* ---- Refinanciar / juntar deudas ---- */
function deudasPendientes(){
  const t = hoy();
  return S.prestamos.filter(L => !esCongelado(L) && pendientes(L).length).map(L => {
    const pend = pendientes(L), venc = pend.filter(c => c.fecha <= t);
    return {L, cap:r2(pend.reduce((s, c) => s + c.capital, 0)), intPend:r2(pend.reduce((s, c) => s + c.interes, 0)),
      intVenc:r2(venc.reduce((s, c) => s + c.interes + moraDe(c), 0)), desde:pend[0].fecha};
  }).sort((a, b) => a.L.cliente.localeCompare(b.L.cliente) || a.desde.localeCompare(b.desde));
}
function seleccionRefi(){ const ids = new Set(borrador.refi.ids); return deudasPendientes().filter(d => ids.has(d.L.id)); }
const interesRefi = () => borrador.refi.interes ?? r2(seleccionRefi().reduce((s, d) => s + d.intVenc, 0));
const baseRefi = () => r2(seleccionRefi().reduce((s, d) => s + d.cap, 0) + interesRefi() - (+borrador.refi.abono || 0));
function extraRefi(){
  const sel = seleccionRefi(), int = interesRefi(), ab = +borrador.refi.abono || 0;
  return sel.map(d => `${num(d.cap)}cap`).join('+') + (int ? `+${num(int)}int` : '') + (ab ? `-${num(ab)}` : '') + `=${num(baseRefi())}`;
}
function panelRefi(){
  const r = borrador.refi, ids = new Set(r.ids), q = (r.q || '').toLowerCase();
  const ds = deudasPendientes().filter(d => ids.has(d.L.id) || !q || d.L.cliente.toLowerCase().includes(q) || (d.L.apodo || '').toLowerCase().includes(q));
  return `<div class="card" style="padding:14px;margin-bottom:12px" id="refiPanel">
    <div style="font-weight:700">1. Elige las deudas que entran en el nuevo préstamo</div>
    <div class="hint">Pueden ser de una o varias personas (por ejemplo, una pareja). Sus cuotas pendientes se cierran y todo pasa a este préstamo.</div>
    <input id="refiBuscar" placeholder="Buscar cliente…" value="${esc(r.q || '')}" style="margin-top:10px">
    <div class="refi-list">${ds.map(d => `<label class="refi-item ${ids.has(d.L.id) ? 'on' : ''}"><input type="checkbox" data-id="${d.L.id}" ${ids.has(d.L.id) ? 'checked' : ''}>${avatar(d.L.cliente)}
      <div style="min-width:0"><b>${esc(d.L.cliente)}</b>${chipEtq(d.L)} <span class="hint">${esc(d.L.formula.split('\n')[0])}</span>
        <div class="hint">Debe ${money(d.cap)} de capital${d.intVenc ? ` · ${money(d.intVenc)} de interés vencido` : ''} · pendiente desde ${fD(d.desde)}</div></div></label>`).join('')
      || '<div class="empty">No hay deudas pendientes' + (q ? ' con ese nombre' : '') + '.</div>'}</div>
    <div style="font-weight:700;margin-top:14px">2. Ajusta lo que se suma y lo que se descuenta</div>
    <div class="form" style="padding:8px 0 0">
      <label>Interés no pagado que se suma (S/)<input id="refiInt" type="number" min="0" step="any" value="${interesRefi()}"><span class="hint" style="font-weight:400">Por defecto: interés y mora de las cuotas ya vencidas</span></label>
      <label>Abono o descuento que se resta (S/)<input id="refiAbono" type="number" min="0" step="any" value="${r.abono || 0}"></label>
    </div>
    <div class="formula" id="refiSuma" style="margin-bottom:0"></div>
    <div style="font-weight:700;margin-top:14px">3. Define el nuevo préstamo abajo</div>
  </div>`;
}
function activarRefi(){
  const p = document.getElementById('refiPanel'), r = borrador.refi;
  const sumar = () => {
    const sel = seleccionRefi();
    document.getElementById('refiSuma').innerHTML = sel.length
      ? `${esc(extraRefi()).replace(/=/, ' = ')}<br><span class="hint">Nuevo capital: <b>${money(baseRefi())}</b>${sel.length > 1 ? ` · junta ${sel.length} deudas` : ''}</span>`

function avisoRiesgo(b){
  if (b.editId || !b.cliente.trim()) return '';
  const c = datosClientes().find(x => x.k === claveCliente(b.cliente));
  if (!c) return '';
  // En un refinanciamiento, el capital de las deudas elegidas ya está contado en lo que debe
  const nuevoRiesgo = b.tipo === 'refi' ? r2(b.capital - seleccionRefi().reduce((s, d) => s + d.cap, 0)) : b.capital;
  const col = r2(c.ganadoTotal - c.capRiesgo), libre = Math.max(0, col);
  const punt = c.cumpl === null ? '' : ` · puntualidad ${c.cumpl}%`;
  if (nuevoRiesgo <= libre)
    return `<div class="riesgo ok"><b>Riesgo bajo.</b> Con ${esc(c.nombre)} ya ganaste ${money(c.ganadoTotal)} de interés${c.capRiesgo ? ` y aún te debe ${money(c.capRiesgo)} de capital` : ''}: este préstamo de ${money(nuevoRiesgo)} queda cubierto por tus ganancias${punt}.</div>`;
  return `<div class="riesgo warn"><b>Atención.</b> Con ${esc(c.nombre)} has ganado ${money(c.ganadoTotal)} de interés${c.capRiesgo ? ` y te debe ${money(c.capRiesgo)} de capital` : ''}. De este préstamo, ${money(r2(nuevoRiesgo - libre))} no está cubierto por lo ya ganado${punt}.</div>`;
}

async function guardarNuevo(){

  if (esRefi){

    nuevo.eventos.push({f:hoy(), t:`Refinanciamiento: ${extraRefi()}`});

      v.cuotas = v.cuotas.filter(c => c.pagado);
      v.cuotas.push({id:uid(), fecha:hoy(), capital:0, interes:0, tipo:'refi', pagado:true, fechaPago:hoy(), movido:cap});

  }

    L = buscarL(borrador.editId);
    Object.assign(L, {...nuevo, id:L.id, creado:L.creado, adjuntos:L.adjuntos || [], eventos:[...L.eventos, {f:hoy(), t:'Préstamo corregido'}]});
    msg = 'Préstamo corregido';
  } else { L = nuevo; S.prestamos.push(L); msg = esRefi ? `Refinanciamiento guardado (${viejos.length} deuda${viejos.length > 1 ? 's' : ''} juntada${viejos.length > 1 ? 's' : ''})` : 'Préstamo guardado'; }
  borrador = nuevoBorrador(); abiertos.add(L.id);
  ir('prestamos'); save(); toast(msg, snap);
  if (archivos.length) await subirAdjuntos(L.id, archivos);
}

const MESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

const claveCliente = n => n.trim().toLowerCase();
function avatar(nombre, grande){

  const ini = nombre.trim().split(/\s+/).filter(w => /^\p{L}/u.test(w)).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';

function datosClientes(){
  const grupos = new Map();
  for (const L of S.prestamos){ const k = claveCliente(L.cliente); if (!grupos.has(k)) grupos.set(k, []); grupos.get(k).push(L); }
  return [...grupos].map(([k, todos]) => {
    todos = todos.slice().sort(porCreacion);
    // Lo del año en foco: préstamos, cobros (por fecha de pago) y puntualidad (por fecha límite).
    // Deuda, próximo pago y riesgo siempre se calculan con todo, porque son el estado de hoy.
    const ps = todos.filter(prestamoEnAnio), cs = todos.flatMap(L => L.cuotas), pendTodo = cs.filter(c => !c.pagado);
    // Deuda congelada: queda registrada y cuenta para el riesgo, pero no aparece como deuda del día.
    const pend = todos.filter(L => !esCongelado(L)).flatMap(L => pendientes(L)), cong = todos.filter(L => esCongelado(L)).flatMap(L => pendientes(L));
    const pagadas = cs.filter(c => c.pagado && enAnio(c.fecha)), delAnio = cs.filter(c => enAnio(c.fecha));
    const ult = todos.at(-1), ultimoDe = f => todos.map(f).filter(Boolean).at(-1);
    return {k, prestamos:ps, todos, nombre:ult.cliente, apodo:ultimoDe(L => L.apodo) || '', tel:ultimoDe(L => L.tel) || '', ingreso:ultimoDe(L => L.ingreso) || 0,
      prestado:r2(todos.filter(L => enAnio(L.cuotas[0]?.fecha || L.creado)).reduce((s, L) => s + (+L.capital || 0), 0)),
      nPrestados:todos.filter(L => enAnio(L.cuotas[0]?.fecha || L.creado)).length,
      cobrado:r2(pagadas.reduce((s, c) => s + c.capital + c.interes, 0)),
      ganado:r2(pagadas.reduce((s, c) => s + c.interes, 0)),
      ganadoTotal:r2(cs.filter(c => c.pagado).reduce((s, c) => s + c.interes, 0)),
      debe:r2(pend.reduce((s, c) => s + c.capital + c.interes, 0)),
      atrasado:pend.some(c => c.fecha < hoy()), activos:todos.filter(L => !esCongelado(L) && pendientes(L).length).length,
      cumpl:cumplimiento(delAnio), desde:todos.map(L => L.cuotas[0]?.fecha || L.creado).sort()[0],
      porCobrarInt:r2(pend.reduce((s, c) => s + c.interes, 0)),
      capRiesgo:r2(pendTodo.reduce((s, c) => s + c.capital, 0)),
      congelado:r2(cong.reduce((s, c) => s + c.capital + c.interes, 0)),
      proximas:pend.slice().sort((a, b) => a.fecha.localeCompare(b.fecha)),
      ultimoPago:cs.filter(c => c.pagado && c.fechaPago).sort((a, b) => b.fechaPago.localeCompare(a.fechaPago))[0] || null,
      sem:semaforo(delAnio),
      _:0};
  }).filter(c => c.prestamos.length);
}

  if (q.tipo === 'abono') return '<span class="chip violet">Abono</span>';
  if (q.pagado){
    const e = estadoCumpl(q), int = q.tipo === 'interes';

}
const celdaPago = (q, fx) => q.pagado && q.fechaPago && q.tipo !== 'refi' ? fx(q.fechaPago) : '<span class="hint">—</span>';
/* Cuotas de un préstamo con columnas nombradas y totales, para corroborar la cuenta. */
/* "Prestado" de cada cuota = capital que se debía al empezar esa cuota (monto del préstamo menos el capital

function saldoAuto(L, q){
  let s = +L.capital || 0;

      <td>${celdaPago(q, fx)}</td><td>${estado}</td>

    <tfoot><tr><td colspan="3"><b>Total ${anioFoco === 'todos' ? '' : anioFoco}</b></td><td class="n"><b>${num(r2(sum.cap))}</b></td><td class="n"><b>${num(r2(sum.int))}</b></td><td class="n"><b>${num(r2(sum.adic))}</b></td><td class="n"><b>${num(r2(sum.cap + sum.int + sum.adic))}</b></td>
      <td colspan="4" class="hint">Pagado <b>${money(sum.pag)}</b> · Pendiente <b>${money(sum.pend)}</b></td></tr></tfoot></table></div></div>`;

/* El respaldo es un .json; si hay archivos adjuntos, va dentro de un .zip junto con ellos. */
async function construirRespaldo(){
  const json = JSON.stringify(S, null, 1), metas = S.prestamos.flatMap(L => L.adjuntos || []);
  if (!metas.length) return {blob:new Blob([json], {type:'application/json'}), ext:'json'};
  const files = [{name:'respaldo.json', data:json}];
  for (const m of metas){ const r = await DB.get(m.id); if (r) files.push({name:`adjuntos/${m.id}`, data:new Uint8Array(await r.blob.arrayBuffer())}); }
  return {blob:XLSX.zip(files, 'application/zip'), ext:'zip'};
}
async function exportarJSON(){
  try { const r = await construirRespaldo(); S.ultimoRespaldo = hoy(); descargar(`belu-bank-respaldo-${hoy()}.${r.ext}`, r.blob, r.blob.type); save(); }
  catch(e){ console.error(e); toast('No se pudo crear el respaldo'); }
}
async function unzip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf), out = {};
  let e = u8.length - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('zip');
  let p = dv.getUint32(e + 16, true);
  for (let i = 0, n = dv.getUint16(e + 10, true); i < n; i++){
    const metodo = dv.getUint16(p + 10, true), comp = dv.getUint32(p + 20, true), ln = dv.getUint16(p + 28, true), off = dv.getUint32(p + 42, true);
    const nombre = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + ln));
    const ini = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    let datos = u8.slice(ini, ini + comp);
    if (metodo === 8) datos = new Uint8Array(await new Response(new Blob([datos]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    out[nombre] = datos;
    p += 46 + ln + dv.getUint16(p + 30, true) + dv.getUint16(p + 32, true);
  }
  return out;
}

/* Un .xlsx es un ZIP con archivos XML. Se arma aquí mismo para que funcione sin internet.
   Las fórmulas llevan su resultado ya calculado, así el archivo se ve bien incluso en
   visores que no recalculan (vista previa de WhatsApp o Drive). */
const XLSX = (() => {
  const enc = new TextEncoder();
  const T = new Uint32Array(256).map((_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });
  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };

  function zip(files, type = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'){
    const parts = [], central = []; let off = 0;
    for (const f of files){
      const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
      h.setUint16(12, 0x21, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
      h.setUint16(26, name.length, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
      c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
      c.setUint16(28, name.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), name);
      off += 30 + name.length + data.length;
    }
    const size = central.reduce((s, a) => s + a.length, 0), e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, size, true); e.setUint32(16, off, true);
    return new Blob([...parts, ...central, new Uint8Array(e.buffer)], {type});
  }

  const x = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const col = i => { let s = ''; for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; };

      if (typeof v.v === 'number') return `<c r="${ref}"${s}>${f}<v>${v.v}</v></c>`;
      return `<c r="${ref}"${s} t="str">${f}<v>${x(v.v ?? '')}</v></c>`;
    }

    if (v.v === '' ) return s ? `<c r="${ref}"${s}/>` : '';

  }

  function sheet(sh, selected){
    const rows = sh.rows.map((r, i) => `<row r="${i + 1}"${i === 0 && sh.headerRow ? ' ht="30" customHeight="1"' : ''}>${r.map((v, j) => cell(v, col(j) + (i + 1))).join('')}</row>`).join('');
    const pane = sh.freeze ? `<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>` : '';
    const cols = `<cols>${sh.cols.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>`;
    let p = 1;
    const cf = (sh.cf || []).map(c => `<conditionalFormatting sqref="${c.ref}">${c.rules.map(r => `<cfRule type="expression" dxfId="${r.dxf}" priority="${p++}"><formula>${x(r.f)}</formula></cfRule>`).join('')}</conditionalFormatting>`).join('');
    const dv = sh.dv?.length ? `<dataValidations count="${sh.dv.length}">${sh.dv.map(d => `<dataValidation type="list" allowBlank="1" showErrorMessage="1" sqref="${d.ref}"><formula1>${x('"' + d.list.join(',') + '"')}</formula1></dataValidation>`).join('')}</dataValidations>` : '';
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0"${selected ? ' tabSelected="1"' : ''}${sh.grid === false ? ' showGridLines="0"' : ''}>${pane}</sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/>${cols}<sheetData>${rows}</sheetData>${sh.filter ? `<autoFilter ref="${sh.filter}"/>` : ''}${cf}${dv}<pageMargins left="0.7" right="0.7" top="0.75" bottom="0.75" header="0.3" footer="0.3"/></worksheet>`;
  }

const serial = s => (Date.UTC(...(p => [p.y, p.m - 1, p.d])(P(s))) - Date.UTC(1899, 11, 30)) / 864e5;
// Excel no acepta textos de más de 255 caracteres dentro de una fórmula: se parten en trozos unidos con &.
const xlText = s => s.match(/[\s\S]{1,200}/g).map(p => '"' + p.replace(/"/g, '""') + '"').join('&');

function construirExcel(){
  const t = hoy();
  const eom = (() => { const p = P(t); return t.slice(0, 8) + pad(new Date(p.y, p.m, 0).getDate()); })();
  const num = new Map(S.prestamos.map((L, i) => [L, i + 1]));
  const filas = [];
  S.prestamos.forEach(L => L.cuotas.forEach(c => filas.push({L, c})));
  filas.sort((a, b) => a.c.fecha.localeCompare(b.c.fecha) || num.get(a.L) - num.get(b.L));
  const n = Math.max(2, filas.length + 1);
  const R = c => `Cuotas!$${c}$2:$${c}$${n}`;
  const situacion = c => c.pagado ? 'Pagado' : c.fecha < t ? 'Atrasado' : c.fecha <= eom ? 'Este mes' : 'Pendiente';
  const H = (txt, gris) => ({v:txt, s:gris ? 8 : 1});

  /* ---- Cuotas ---- */
  const cuotas = [[H('Préstamo N°'), H('Cliente'), H('Cuota'), H('Tipo'), H('Fecha límite'), H('Capital'), H('Interés'), H('Total', 1), H('Estado'), H('Fecha de pago'), H('Días de atraso', 1), H('Situación', 1), H('Recordatorio', 1)]];
  filas.forEach(({L, c}, i) => {
    const r = i + 2, tot = r2(c.capital + c.interes), sit = situacion(c);
    let wa = '';
    if (!c.pagado){
      const venc = c.fecha < t ? `venció el ${fD(c.fecha)}` : `vence el ${fD(c.fecha)}`;
      const msg = `Hola ${L.cliente}, te recuerdo que tu cuota ${posicion(L, c)} de ${money(tot)} ${venc}. ¡Gracias!`;
      let tel = (L.tel || '').replace(/\D/g, ''); if (tel.length === 9) tel = '51' + tel;
      wa = {f:`HYPERLINK(${xlText(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`)},"WhatsApp")`, v:'WhatsApp', s:7};
    }
    cuotas.push([
      {v:num.get(L), s:11}, {v:L.cliente + (etiqueta(L).n ? ` (${textoEtq(L)})` : ''), s:4}, {v:posicion(L, c), s:4}, {v:c.fijo ? 'Monto fijo' : c.tipo === 'interes' ? 'Solo interés' : c.tipo === 'refi' ? 'Refinanciado' : c.tipo === 'abono' ? 'Abono' : 'Normal', s:4},
      {v:serial(c.fecha), s:3}, {v:c.capital, s:2}, {v:c.interes, s:2},
      {f:`F${r}+G${r}`, v:tot, s:2},
      {v:c.pagado ? 'Pagado' : 'Pendiente', s:4}, c.fechaPago ? {v:serial(c.fechaPago), s:3} : {v:'', s:3},
      {f:`IF(I${r}="Pagado","",MAX(0,TODAY()-E${r}))`, v:c.pagado ? '' : Math.max(0, daysBetween(c.fecha, t)), s:11},
      {f:`IF(I${r}="Pagado","Pagado",IF(E${r}<TODAY(),"Atrasado",IF(E${r}<=EOMONTH(TODAY(),0),"Este mes","Pendiente")))`, v:sit, s:4},
      wa,
    ]);
  });

  /* ---- Préstamos ---- */
  const prest = [[H('N°'), H('Cliente'), H('Teléfono'), H('Fórmula (como en la nota)'), H('Capital prestado'), H('Interés total'), H('Cuotas'),
    H('Capital pendiente', 1), H('Interés por cobrar', 1), H('Interés cobrado', 1), H('Próximo vencimiento'), H('Pagadas'), H('Estado'), H('Nota'), H('Apodo'), H('Ingreso mensual'), H('% cumplido')]];
  S.prestamos.forEach((L, i) => {
    const r = i + 2, k = num.get(L), pend = pendientes(L), pag = L.cuotas.filter(c => c.pagado);
    const sum = (arr, f) => r2(arr.reduce((s, c) => s + c[f], 0));
    prest.push([
      {v:k, s:11}, {v:L.cliente + (etiqueta(L).n ? ` (${textoEtq(L)})` : ''), s:4}, {v:L.tel || '', s:4}, {v:(L.formula || '').replace(/\n/g, '  →  '), s:4},
      {v:L.capital, s:2}, {v:sum(L.cuotas, 'interes'), s:2}, {v:L.cuotas.length, s:11},
      {f:`SUMIFS(${R('F')},${R('A')},A${r},${R('I')},"Pendiente")`, v:sum(pend, 'capital'), s:2},
      {f:`SUMIFS(${R('G')},${R('A')},A${r},${R('I')},"Pendiente")`, v:sum(pend, 'interes'), s:2},
      {f:`SUMIFS(${R('G')},${R('A')},A${r},${R('I')},"Pagado")`, v:sum(pag, 'interes'), s:2},
      pend.length ? {v:serial(pend[0].fecha), s:3} : {v:'—', s:4},
      {v:`${pag.length}/${L.cuotas.length}`, s:4}, {v:estadoPrestamo(L).t, s:4}, {v:L.nota || '', s:4},
      {v:L.apodo || '', s:4}, L.ingreso ? {v:L.ingreso, s:2} : {v:'', s:4}, (cp => cp === null ? {v:'—', s:4} : {v:cp / 100, s:12})(cumplimiento(L.cuotas)),
    ]);
  });
  const np = Math.max(2, S.prestamos.length + 1);

  /* ---- Resumen ---- */
  const todas = filas.map(f => f.c);
  const sumWhere = (pred, f) => r2(todas.filter(pred).reduce((s, c) => s + (f === 'tot' ? c.capital + c.interes : c[f]), 0));
  const enMes = (c, m) => c.pagado && mesKey(c.fecha) === m;
  const mesAct = t.slice(0, 7), anio = +t.slice(0, 4);
  const MESL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const pagadoMes = `${R('I')},"Pagado",${R('E')},">"&EOMONTH(TODAY(),-1),${R('E')},"<="&EOMONTH(TODAY(),0)`;
  const kpis = [
    ['Capital en la calle', `SUMIFS(${R('F')},${R('I')},"Pendiente")`, sumWhere(c => !c.pagado, 'capital')],
    ['Interés por cobrar', `SUMIFS(${R('G')},${R('I')},"Pendiente")`, sumWhere(c => !c.pagado, 'interes')],
    ['Por cobrar este mes (incluye atrasados)', `SUMIFS(${R('H')},${R('I')},"Pendiente",${R('E')},"<="&EOMONTH(TODAY(),0))`, sumWhere(c => !c.pagado && c.fecha <= eom, 'tot')],
    ['Cobrado este mes', `SUMIFS(${R('H')},${pagadoMes})`, sumWhere(c => enMes(c, mesAct), 'tot')],
    ['Ganancia (interés) este mes', `SUMIFS(${R('G')},${pagadoMes})`, sumWhere(c => enMes(c, mesAct), 'interes')],
    ['Monto atrasado', `SUMIFS(${R('H')},${R('I')},"Pendiente",${R('E')},"<"&TODAY())`, sumWhere(c => !c.pagado && c.fecha < t, 'tot')],
    ['Ganancia total (interés cobrado)', `SUMIFS(${R('G')},${R('I')},"Pagado")`, sumWhere(c => c.pagado, 'interes')],
  ];
  const res = [
    [{v:'BeluBank · Resumen', s:5}],
    [{v:`Generado desde la app el ${fD(t)}${fD(t).length === 5 ? '/' + anio : ''}. Para restaurar la app usa el respaldo .json, no este archivo.`, s:10}],
    [],
    ...kpis.map(([l, f, v]) => [{v:l, s:4}, {f, v, s:6}]),
    [{v:'Cuotas atrasadas', s:4}, {f:`COUNTIFS(${R('I')},"Pendiente",${R('E')},"<"&TODAY())`, v:todas.filter(c => !c.pagado && c.fecha < t).length, s:11}],
    [{v:'Préstamos activos', s:4}, {f:`COUNTIF('Préstamos'!$M$2:$M$${np},"Al día")+COUNTIF('Préstamos'!$M$2:$M$${np},"Atrasado")`, v:S.prestamos.filter(L => pendientes(L).length).length, s:11}],
    [],
    [{v:'Año', s:9}, {v:anio, s:11}],
    [H('Mes', 1), H('Por cobrar (pendiente)', 1), H('Capital cobrado', 1), H('Interés ganado', 1), H('Total cobrado', 1)],
  ];
  const yRow = res.length - 1, first = res.length + 1;
  MESL.forEach((m, i) => {
    const r = res.length + 1, key = `${anio}-${pad(i + 1)}`;
    const ini = `DATE($B$${yRow},${i + 1},1)`, fin = `EOMONTH(DATE($B$${yRow},${i + 1},1),0)`;
    const rng = c => `${R(c)},">="&${ini},${R(c)},"<="&${fin}`;
    const cap = sumWhere(c => enMes(c, key), 'capital'), int = sumWhere(c => enMes(c, key), 'interes');
    res.push([{v:m, s:4},
      {f:`SUMIFS(${R('H')},${R('I')},"Pendiente",${rng('E')})`, v:sumWhere(c => !c.pagado && mesKey(c.fecha) === key, 'tot'), s:2},
      {f:`SUMIFS(${R('F')},${R('I')},"Pagado",${rng('E')})`, v:cap, s:2},
      {f:`SUMIFS(${R('G')},${R('I')},"Pagado",${rng('E')})`, v:int, s:2},
      {f:`C${r}+D${r}`, v:r2(cap + int), s:2}]);
  });
  const last = res.length;
  res.push([{v:'Total del año', s:9}, ...['B', 'C', 'D', 'E'].map(c => {
    let v = 0; for (let r = first; r <= last; r++) v += res[r - 1][c.charCodeAt(0) - 65].v; return {f:`SUM(${c}${first}:${c}${last})`, v:r2(v), s:6};
  })]);

  const ref = `A2:M${n}`;
  return XLSX.book([
    {name:'Resumen', cols:[38, 20, 16, 16, 16], rows:res, grid:false},
    {name:'Préstamos', cols:[6, 20, 13, 42, 12, 12, 8, 13, 12, 12, 13, 9, 11, 50, 14, 13, 11], rows:prest, freeze:true, headerRow:true, filter:`A1:Q${np}`,
      cf:[{ref:`A2:Q${np}`, rules:[{f:'$M2="Atrasado"', dxf:0}, {f:'$M2="Pagado"', dxf:2}]}]},
    {name:'Cuotas', cols:[9, 20, 8, 12, 12, 12, 12, 12, 11, 12, 9, 11, 12], rows:cuotas, freeze:true, headerRow:true, filter:`A1:M${n}`,
      cf:[{ref, rules:[{f:'$L2="Atrasado"', dxf:0}, {f:'$L2="Este mes"', dxf:1}, {f:'$L2="Pagado"', dxf:2}]}],
      dv:[{ref:`I2:I${n + 200}`, list:['Pendiente', 'Pagado']}, {ref:`D2:D${n + 200}`, list:['Normal', 'Solo interés']}]},
  ]);
}

document.getElementById('fileIn').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const buf = await f.arrayBuffer(), u8 = new Uint8Array(buf);
    let d, archivos = {};
    if (u8[0] === 0x50 && u8[1] === 0x4b){ archivos = await unzip(buf); d = JSON.parse(new TextDecoder().decode(archivos['respaldo.json'])); }
    else d = JSON.parse(new TextDecoder().decode(u8));
    if (!Array.isArray(d.prestamos)) throw new Error('formato');
    normalizarTextos(d);
    // Archivo "para agregar" (o botón Agregar): suma préstamos sin borrar lo que ya hay.
    if (d.tipo === 'agregar' || modoArchivo === 'agregar') return fusionarRespaldo(d);
    if (!confirm(`¿Reemplazar los datos actuales con el respaldo (${d.prestamos.length} préstamos)?`)) return;
    for (const L of d.prestamos) for (const m of L.adjuntos || []){
      const datos = archivos['adjuntos/' + m.id];
      if (datos) await DB.put({id:m.id, blob:new Blob([datos], {type:m.tipo})});
    }
    S = d; S.ejemplo = false; save(); toast('Respaldo restaurado');
  } catch(err){ console.error(err); toast('Ese archivo no es un respaldo válido'); }
};
let modoArchivo = 'restaurar';
function elegirArchivo(modo){ modoArchivo = modo; document.getElementById('fileIn').click(); }
/* Agrega los préstamos del archivo que todavía no están (por id). Los marcados "_actualizar" reemplazan al mismo préstamo. */
function fusionarRespaldo(d){
  const existe = id => S.prestamos.some(x => x.id === id);
  const nuevos = d.prestamos.filter(L => !existe(L.id)), corregir = d.prestamos.filter(L => L._actualizar && existe(L.id));
  if (!nuevos.length && !corregir.length){ toast('Ese archivo no trae préstamos nuevos: ya estaban todos.'); return; }
  if (!confirm(`Se agregarán ${nuevos.length} préstamo(s)${corregir.length ? ` y se corregirán ${corregir.length}` : ''}. Lo que ya tienes no se borra. ¿Continuar?`)) return;
  const snap = snapshot(), limpio = ({_actualizar, ...L}) => L;
  if (S.ejemplo){ S.prestamos = []; S.ejemplo = false; }
  for (const L of corregir) S.prestamos[S.prestamos.findIndex(x => x.id === L.id)] = limpio(L);
  for (const L of nuevos) S.prestamos.push(limpio(L));
  S.prestamos.sort(porCreacion); save();
  toast(`${nuevos.length} préstamo(s) agregados${corregir.length ? `, ${corregir.length} corregido(s)` : ''}`, snap);
}
function borrarTodo(){ if (confirm('¿Borrar todos los préstamos? (Descarga un respaldo antes si quieres conservarlos)')) { S = {prestamos:[], ultimoRespaldo:S.ultimoRespaldo, ejemplo:false}; save(); } }

/* ================= Archivos adjuntos ================= */
/* Contratos, fotos y videos se guardan en IndexedDB (aguanta archivos grandes);
   en los datos del préstamo solo queda la ficha de cada archivo. */
const DB = (() => {
  let conexion;
  const abrir = () => conexion ||= new Promise((ok, mal) => {
    const r = indexedDB.open('belubank', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('adjuntos', {keyPath:'id'});
    r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error);
  });
  const tx = (modo, fn) => abrir().then(db => new Promise((ok, mal) => {
    const t = db.transaction('adjuntos', modo), req = fn(t.objectStore('adjuntos'));
    t.oncomplete = () => ok(req.result); t.onerror = () => mal(t.error); t.onabort = () => mal(t.error);
  }));
  return {put:o => tx('readwrite', st => st.put(o)), get:id => tx('readonly', st => st.get(id)),
    del:id => tx('readwrite', st => st.delete(id)), keys:() => tx('readonly', st => st.getAllKeys())};
})();
const urlsAdj = new Map();
async function urlAdjunto(id){
  if (urlsAdj.has(id)) return urlsAdj.get(id);
  const r = await DB.get(id); if (!r) return null;
  const u = URL.createObjectURL(r.blob); urlsAdj.set(id, u); return u;
}
function panelAdjuntos(L){
  const ico = t => t.startsWith('video/') ? 'VIDEO' : t === 'application/pdf' ? 'PDF' : 'ARCHIVO';
  setTimeout(() => document.querySelectorAll('img[data-adj]:not([src])').forEach(async img => { const u = await urlAdjunto(img.dataset.adj); if (u) img.src = u; }));
  return `<div class="grp" style="margin-top:14px">Archivos (contratos, fotos, videos)</div><div class="adjs" style="margin-top:0">
    ${(L.adjuntos || []).map(x => `<div class="adj" onclick="verAdjunto('${L.id}','${x.id}')">${x.tipo.startsWith('image/') ? `<img data-adj="${x.id}" alt="">` : `<span class="ico">${ico(x.tipo)}</span>`}<small>${esc(x.nombre)}</small></div>`).join('')}
    <label class="adj add">＋<small>Agregar</small><input type="file" multiple hidden accept="${ACCEPT}" onchange="subirAdjuntos('${L.id}', this.files)"></label></div>`;
}
async function subirAdjuntos(lid, files){
  const L = buscarL(lid); if (!L) return;
  L.adjuntos = L.adjuntos || [];
  let n = 0;
  for (const f of [...files]){
    const meta = {id:uid(), nombre:f.name, tipo:f.type || 'application/octet-stream', tam:f.size, fecha:hoy()};
    try { await DB.put({id:meta.id, blob:f}); L.adjuntos.push(meta); n++; }
    catch(e){ console.error(e); toast(`No se pudo guardar ${f.name} (¿falta espacio?)`); }
  }
  if (n){ L.eventos.push({f:hoy(), t:`Se adjuntaron ${n} archivo(s)`}); abiertos.add(L.id); save(); toast(n > 1 ? `${n} archivos guardados` : 'Archivo guardado'); }
}
async function verAdjunto(lid, id){
  const L = buscarL(lid), m = L.adjuntos.find(x => x.id === id), u = await urlAdjunto(id);
  if (!u){ toast('Este archivo no está en este equipo'); return; }
  const cuerpo = m.tipo.startsWith('image/') ? `<img src="${u}" alt="">` : m.tipo.startsWith('video/') ? `<video src="${u}" controls playsinline></video>`

const b64u = {
  enc:s => { const b = new TextEncoder().encode(s); let t = ''; for (const x of b) t += String.fromCharCode(x); return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); },
  dec:s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0))),

function datosEstado(nombre){
  const ps = prestamosDe(nombre), activos = ps.filter(x => pendientes(x).length);
  return {n:ps[0]?.cliente || nombre, md:moraDia(), p:activos.map(x => pendientes(x).map(c => [c.fecha, c.capital, c.interes, 0, 0, c.moraExonerada ? 1 : 0]))};

  return location.origin + location.pathname + '#estado=' + b64u.enc(JSON.stringify({...datosEstado(L.cliente), g:hoy()}));

function tokenCliente(nombre){
  S.clientes = S.clientes || {};

  if (!S.clientes[k]){
    let t = ''; for (const x of crypto.getRandomValues(new Uint8Array(18))) t += String.fromCharCode(x);
    S.clientes[k] = {token:btoa(t).replace(/\+/g,'-').replace(/\//g,'_'), nombre};
  }

function cortarNube(){ nube.subs.forEach(f => f()); nube.subs = []; nube.uid = null; nube.email = null; nube.ultimos = new Map(); nube.metaUlt = null; nube.estadosUlt = new Map(); }

const metaDe = () => JSON.stringify({ultimoRespaldo:S.ultimoRespaldo || null, drive:S.drive || null, clientes:S.clientes || {}, moraDia:moraDia(), toleranciaDias:toleranciaDias(), diasCongelar:diasCongelar()});
const porCreacion = (a, b) => (a.creado || '').localeCompare(b.creado || '') || a.id.localeCompare(b.id);
async function conectarDatos(u){
  if (nube.uid === u.uid && nube.subs.length) return;
  const {db, m} = nube.fb;
  nube.uid = u.uid; nube.email = u.email; ponerEstadoNube('conectando');
  const col = m.collection(db, 'usuarios', u.uid, 'prestamos'), metaRef = m.doc(db, 'usuarios', u.uid);
  const [snap, metaSnap] = await Promise.all([m.getDocs(col), m.getDoc(metaRef)]);
  const remotos = snap.docs.map(d => JSON.parse(d.data().json));
  nube.ultimos = new Map(snap.docs.map(d => [d.id, d.data().json]));
  nube.metaUlt = metaSnap.exists() ? metaSnap.data().json : null;
  const mismaCuenta = localStorage.getItem(KEY_NUBE) === u.uid, localReal = !S.ejemplo && S.prestamos.length > 0;
  let lista, usarMeta = true;
  if (mismaCuenta && localStorage.getItem(KEY_SUCIO)){
    // Hubo cambios en este equipo sin conexión con la nube: se suben encima de lo que hay allá.
    const porId = new Map(remotos.map(L => [L.id, L])); S.prestamos.forEach(L => porId.set(L.id, L)); lista = [...porId.values()]; usarMeta = false;
  } else if (mismaCuenta || !localReal) lista = remotos;
  else if (!remotos.length){ lista = S.prestamos; usarMeta = false; }
  else if (confirm(`Tu cuenta en la nube ya tiene ${remotos.length} préstamo(s) y este equipo tiene ${S.prestamos.length}.\n\nAceptar: usar los de la nube (se reemplazan los de este equipo).\nCancelar: subir los de este equipo (se reemplazan los de la nube).`)) lista = remotos;
  else { lista = S.prestamos; usarMeta = false; }
  S.prestamos = lista.slice().sort(porCreacion); S.ejemplo = false;
  if (usarMeta && nube.metaUlt) Object.assign(S, JSON.parse(nube.metaUlt));
  localStorage.setItem(KEY_NUBE, u.uid); localStorage.removeItem(KEY_SUCIO);
  guardarLocal(); ponerEstadoNube('ok');
  subirCambios();            // primero se escribe lo local (queda en la caché al instante)…
  escucharCambios(col, metaRef);   // …y después se escuchan los cambios de otros equipos
  if (vista !== 'nuevo' && !dlg.open) render();
}
function escucharCambios(col, metaRef){
  const {m} = nube.fb;
  let primera = true;
  nube.subs = [
    m.onSnapshot(col, snap => {
      if (primera){ primera = false; return; }   // ya se cargó con getDocs
      let cambio = false;
      for (const ch of snap.docChanges()){
        const id = ch.doc.id, i = S.prestamos.findIndex(L => L.id === id);
        if (ch.type === 'removed'){ nube.ultimos.delete(id); if (i >= 0){ S.prestamos.splice(i, 1); cambio = true; } continue; }
        const j = ch.doc.data().json; nube.ultimos.set(id, j);
        if (i < 0){ S.prestamos.push(JSON.parse(j)); cambio = true; }
        else if (JSON.stringify(S.prestamos[i]) !== j){ S.prestamos[i] = JSON.parse(j); cambio = true; }
      }
      if (cambio){ S.prestamos.sort(porCreacion); guardarLocal(); if (vista !== 'nuevo' && !dlg.open) render(); }
    }, errorNube),
    m.onSnapshot(metaRef, doc => {
      if (!doc.exists()) return;
      const j = doc.data().json; nube.metaUlt = j;
      if (j !== metaDe()){ Object.assign(S, JSON.parse(j)); guardarLocal(); }
    }, errorNube),
  ];
}
/* Sube solo lo que cambió: préstamos nuevos o editados, borrados, datos generales y estados de clientes. */
function subirCambios(){
  if (!nubeActiva()) return Promise.resolve();
  const {db, m} = nube.fb, uid = nube.uid, ops = [];
  const actuales = new Map(S.prestamos.map(L => [L.id, JSON.stringify(L)]));
  for (const [id, j] of actuales) if (nube.ultimos.get(id) !== j) ops.push(b => b.set(m.doc(db, 'usuarios', uid, 'prestamos', id), {json:j, actualizado:m.serverTimestamp()}));
  for (const id of nube.ultimos.keys()) if (!actuales.has(id)) ops.push(b => b.delete(m.doc(db, 'usuarios', uid, 'prestamos', id)));
  const meta = metaDe();
  if (meta !== nube.metaUlt) ops.push(b => b.set(m.doc(db, 'usuarios', uid), {json:meta, email:nube.email, actualizado:m.serverTimestamp()}));
  for (const c of Object.values(S.clientes || {})){
    const base = JSON.stringify(datosEstado(c.nombre));
    if (nube.estadosUlt.get(c.token) === base) continue;
    nube.estadosUlt.set(c.token, base);
    const d = JSON.stringify({...JSON.parse(base), g:hoy()});
    ops.push(b => b.set(m.doc(db, 'estados', c.token), {owner:uid, d, actualizado:m.serverTimestamp()}));
  }
  if (!ops.length) return Promise.resolve();
  nube.ultimos = actuales; nube.metaUlt = meta;
  ponerEstadoNube('subiendo');
  const lotes = [];
  for (let i = 0; i < ops.length; i += 400){ const b = m.writeBatch(db); ops.slice(i, i + 400).forEach(f => f(b)); lotes.push(b.commit()); }
  return Promise.all(lotes).then(() => { if (nube.estado === 'subiendo') ponerEstadoNube('ok'); }).catch(errorNube);
}
