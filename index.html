/* ================= Google Drive ================= */
/* Para activarlo hace falta un "ID de cliente OAuth" de Google Cloud (ver README → Google Drive).
   Usa el permiso drive.file: la app solo ve los archivos que ella misma crea en el Drive. */
const GOOGLE_CLIENT_ID = '141238546881-egmisgt0ov6ctitv0jsolg09npor73m2.apps.googleusercontent.com';
const Drive = (() => {
  let token = null, vence = 0;
  const API = 'https://www.googleapis.com';
  const cargarGoogle = () => window.google?.accounts?.oauth2 ? Promise.resolve() : new Promise((ok, mal) => {
    const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client';
    sc.onload = ok; sc.onerror = () => mal(new Error('sin conexión')); document.head.appendChild(sc);
  });
  async function conectar(){
    await cargarGoogle();
    await new Promise((ok, mal) => google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID, scope:'https://www.googleapis.com/auth/drive.file',
      callback:r => { if (r.error) return mal(new Error(r.error)); token = r.access_token; vence = Date.now() + (r.expires_in - 60) * 1000; ok(); },
      error_callback:e => mal(new Error(e.type === 'popup_closed' ? 'cancelado' : e.type)),
    }).requestAccessToken({prompt:S.drive?.permitido ? '' : 'consent'}));
    S.drive = {...(S.drive || {}), permitido:true};
  }
  async function api(url, opt = {}){
    const r = await fetch(API + url, {...opt, headers:{...(opt.headers || {}), Authorization:'Bearer ' + token}});
    if (!r.ok) { const err = new Error('Drive ' + r.status); err.status = r.status; throw err; }
    return r.json();
  }
  async function carpeta(nombre, padre){
    const q = `name='${nombre}' and mimeType='application/vnd.google-apps.folder' and trashed=false` + (padre ? ` and '${padre}' in parents` : '');
    const r = await api(`/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id)`);
    if (r.files.length) return r.files[0].id;
    return (await api('/drive/v3/files?fields=id', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:nombre, mimeType:'application/vnd.google-apps.folder', ...(padre ? {parents:[padre]} : {})})})).id;
  }
  async function subir(nombre, blob, padre){
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify({name:nombre, parents:[padre]})], {type:'application/json'}));
    form.append('file', blob);
    return (await api('/upload/drive/v3/files?uploadType=multipart&fields=id', {method:'POST', body:form})).id;
  }
  // Reemplaza el contenido del archivo si ya existe; si fue borrado del Drive, crea uno nuevo.
  async function guardar(nombre, blob, padre, id){
    if (id) try { return (await api(`/upload/drive/v3/files/${id}?uploadType=media&fields=id`, {method:'PATCH', body:blob})).id; }
      catch(e){ if (e.status !== 404) throw e; }
    return subir(nombre, blob, padre);
  }
  return {conectar, listo:() => !!token && Date.now() < vence, carpeta, subir, guardar};
})();
let syncTimer = null, sincronizando = false;
async function sincronizarDrive(interactivo){
  if (!GOOGLE_CLIENT_ID || sincronizando) return;
  if (!Drive.listo() && !interactivo) { if (vista === 'inicio' || vista === 'prestamos') render(); return; }
  const btn = () => document.getElementById('btnDrive');
  sincronizando = true; if (btn()) btn().textContent = 'Guardando…';
  try {
    if (!Drive.listo()) await Drive.conectar();
    const d = S.drive = {...(S.drive || {})}; d.ids = d.ids || {};
    const raiz = await Drive.carpeta('BeluBank');
    const faltan = S.prestamos.flatMap(L => (L.adjuntos || []).filter(m => !m.drive).map(m => ({L, m})));
    if (faltan.length){
      const carp = await Drive.carpeta('Adjuntos', raiz);
      for (const {L, m} of faltan){ const r = await DB.get(m.id); if (r) m.drive = await Drive.subir(`${L.cliente} - ${m.nombre}`, r.blob, carp); }
    }
    d.ids.json = await Drive.guardar('belu-bank-respaldo.json', new Blob([JSON.stringify(S, null, 1)], {type:'application/json'}), raiz, d.ids.json);
    d.ids.xlsx = await Drive.guardar('BeluBank.xlsx', construirExcel(), raiz, d.ids.xlsx);
    d.ultimo = new Date().toISOString(); S.ultimoRespaldo = hoy();
    guardarLocal(); render();
    if (interactivo) toast('Guardado en Google Drive ✓');
  } catch(e){ console.error(e); toast('No se pudo guardar en Drive' + (e.message ? ` (${e.message})` : '')); }
  finally { sincronizando = false; if (btn()) btn().textContent = 'Guardar en Drive ahora'; }
}

/* ================= Acciones ================= */
const buscarL = id => S.prestamos.find(l => l.id === id);
let deshacer = null;
function snapshot(){ return JSON.stringify(S.prestamos); }
function pagar(lid, cid){
  const L = buscarL(lid), c = L.cuotas.find(x => x.id === cid), snap = snapshot(), mora = moraDe(c);
  if (mora){ c.mora = mora; c.interes = r2(c.interes + mora); }
  c.pagado = true; c.fechaPago = hoy();
  L.eventos.push({f:hoy(), t:`Pagó cuota ${posicion(L,c)}: ${money(c.capital+c.interes)}${mora ? ` (incluye ${money(mora)} de mora)` : ''}`});
  save(); toast(`${L.cliente}: cuota ${posicion(L,c)} pagada (${money(c.capital+c.interes)})`, snap);
}
function despagar(lid, cid){
  const L = buscarL(lid), c = L.cuotas.find(x => x.id === cid);
  if (!confirm(`¿Marcar la cuota ${posicion(L,c)} de ${L.cliente} como NO pagada?`)) return;
  if (c.mora){ c.interes = r2(c.interes - c.mora); delete c.mora; }
  c.pagado = false; c.fechaPago = null; L.eventos.push({f:hoy(), t:`Se desmarcó el pago de la cuota ${posicion(L,c)}`}); save();
}
/* Abono: el cliente paga de más y se descuenta de las próximas cuotas (primero capital, luego interés).
   Queda una fila "abono" con lo recibido; si una cuota queda en 0, se marca como cubierta. */
function dlgAbono(lid){
  const L = buscarL(lid), pend = pendientes(L);
  if (!pend.length) return;
  const debe = r2(pend.reduce((s, c) => s + c.capital + c.interes, 0));
  dialogo(`Abono de ${L.cliente}`, `<div class="form">
    <label>Monto que pagó de más (S/)<input name="m" type="number" min="0" step="any" value="" placeholder="Ej. 100"></label>
    <label>Fecha<input name="f" type="date" value="${hoy()}"></label>
    <p class="full hint" id="expl" style="margin:0"></p></div>`,
    b => { const m = Math.min(+val(b,'m') || 0, debe); if (m > 0) registrarAbono(L, m, val(b,'f') || hoy()); }, 'Registrar abono', b => {
      const m = Math.min(+val(b,'m') || 0, debe);
      let rest = m;
      const filas = pend.map(c => { const cap = Math.min(rest, c.capital); rest = r2(rest - cap); const int = Math.min(rest, c.interes); rest = r2(rest - int);
        return {c, cap, int}; }).filter(x => x.cap || x.int);
      b.querySelector('#expl').innerHTML = !m ? `Debe en total ${money(debe)}. El abono se descuenta de las próximas cuotas, primero del capital.`
        : filas.map(x => `Cuota ${posicion(L, x.c)} (${fD(x.c.fecha)}): ${money(x.c.capital + x.c.interes)} → <b>${money(r2(x.c.capital + x.c.interes - x.cap - x.int))}</b>`).join('<br>');
    });
}
function registrarAbono(L, monto, fecha){
  const snap = snapshot(), pend = pendientes(L), aplicado = [];
  let rest = monto, capT = 0, intT = 0;
  for (const c of pend){
    if (rest <= 0) break;
    const cap = Math.min(rest, c.capital); rest = r2(rest - cap);
    const int = Math.min(rest, c.interes); rest = r2(rest - int);
    if (!cap && !int) continue;
    c.capital = r2(c.capital - cap); c.interes = r2(c.interes - int); capT = r2(capT + cap); intT = r2(intT + int);
    const cubre = c.capital + c.interes === 0;
    if (cubre){ c.pagado = true; c.fechaPago = fecha; c.cubierta = true; }
    aplicado.push({id:c.id, cap, int, cubre});
  }
  const idx = L.cuotas.indexOf(pend[0]);
  L.cuotas.splice(idx, 0, {id:uid(), fecha, capital:capT, interes:intT, tipo:'abono', pagado:true, fechaPago:fecha, aplicado});
  L.eventos.push({f:hoy(), t:`Abono de ${money(monto)} descontado de las próximas cuotas`});
  save(); toast(`${L.cliente}: abono de ${money(monto)} registrado`, snap);
}
function anularAbono(lid, cid){
  const L = buscarL(lid), a = L.cuotas.find(x => x.id === cid);
  if (!confirm(`¿Anular el abono de ${money(a.capital + a.interes)}? Las cuotas vuelven a su monto anterior.`)) return;
  const snap = snapshot();
  for (const x of a.aplicado || []){
    const c = L.cuotas.find(q => q.id === x.id); if (!c) continue;
    c.capital = r2(c.capital + x.cap); c.interes = r2(c.interes + x.int);
    if (x.cubre){ c.pagado = false; c.fechaPago = null; delete c.cubierta; }
  }
  L.cuotas = L.cuotas.filter(x => x !== a);
  L.eventos.push({f:hoy(), t:'Se anuló un abono'});
  save(); toast('Abono anulado', snap);
}
function borrarCuota(lid, cid){
  const L = buscarL(lid), c = L.cuotas.find(x => x.id === cid);
  if (c.tipo === 'abono') return anularAbono(lid, cid);
  if (L.cuotas.length === 1) return eliminar(lid);
  if (!confirm(`¿Borrar la cuota ${posicion(L, c)} de ${L.cliente} (${fD(c.fecha)}, ${money(c.capital + c.interes)})?`)) return;
  const snap = snapshot();
  L.cuotas = L.cuotas.filter(x => x !== c);
  L.eventos.push({f:hoy(), t:`Se borró una cuota de ${money(c.capital + c.interes)} (${fD(c.fecha)})`});
  save(); toast('Cuota borrada', snap);
}
/* Congelar: la deuda queda guardada (historial, riesgo) pero sale de Cobros, de los atrasados y de los totales del día,
   y no suma mora. Se puede descongelar cuando se quiera. */
function congelar(lid){
  const L = buscarL(lid), snap = snapshot(), estaba = esCongelado(L);
  if (!estaba && !confirm(`¿Congelar la deuda de ${L.cliente} (${money(pendientes(L).reduce((s, c) => s + c.capital + c.interes, 0))})? Queda guardada en Atrasados → Congelados, pero ya no aparece en Cobros ni suma mora.`)) return;
  if (estaba){ L.congelado = false; L.descongelado = true; }       // descongelar (también si fue automático)
  else { L.congelado = true; delete L.descongelado; pendientes(L).forEach(c => c.moraExonerada = true); }
  L.eventos.push({f:hoy(), t:estaba ? 'Deuda descongelada' : 'Deuda congelada'});
  save(); toast(estaba ? `${L.cliente}: deuda activa otra vez` : `${L.cliente}: deuda congelada`, snap);
}
function exonerar(lid, cid){
  const L = buscarL(lid), c = L.cuotas.find(x => x.id === cid), snap = snapshot();
  c.moraExonerada = !c.moraExonerada;
  L.eventos.push({f:hoy(), t:c.moraExonerada ? `Mora exoneradaen la cuota ${posicion(L,c)}` : `Se vuelve a cobrar mora en la cuota ${posicion(L,c)}`});
  save(); toast(c.moraExonerada ? `${L.cliente}: mora exonerada` : `${L.cliente}: se cobra la mora`, snap);
}
function quitarMora(lid, cid){
  const L = buscarL(lid), c = L.cuotas.find(x => x.id === cid), snap = snapshot();
  if (!c.mora) return;
  L.eventos.push({f:hoy(), t:`Mora de ${money(c.mora)} exonerada en la cuota ${posicion(L,c)}`});
  c.interes = r2(c.interes - c.mora); delete c.mora; c.moraExonerada = true;
  save(); toast(`${L.cliente}: mora exonerada`, snap);
}
function anularInteres(lid, cid){
  const L = buscarL(lid), c = L.cuotas.find(x => x.id === cid);
  if (!confirm('¿Anular este pago de solo interés? Las cuotas pendientes vuelven un mes atrás.')) return;
  deshacerSoloInteres(L, c); save();
}
function eliminar(lid){ const L = buscarL(lid); if (!confirm(`¿Eliminar el préstamo de ${L.cliente}? Esto borra también su historial.`)) return; const snap = snapshot(); S.prestamos = S.prestamos.filter(l => l !== L); save(); toast('Préstamo eliminado', snap); }

function whatsapp(lid, cid){
  const L = buscarL(lid), c = L.cuotas.find(x => x.id === cid), t = hoy();
  const venc = c.fecha < t ? `venció el ${fD(c.fecha)}` : c.fecha === t ? 'vence hoy' : `vence el ${fD(c.fecha)}`;
  const mora = moraDe(c);
  const msg = `Hola ${L.cliente}, te recuerdo que tu cuota ${posicion(L,c)} de ${money(c.capital+c.interes)} ${venc}.${mora ? ` A hoy suma ${money(mora)} de mora (${money(moraDia())} por día), total ${money(totalHoy(c))}.` : ''} Cualquier cosa me avisas. ¡Gracias!`;
  let tel = (L.tel||'').replace(/\D/g,''); if (tel.length === 9) tel = '51'+tel;
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`, '_blank');
}

/* ---------- Diálogos ---------- */
const dlg = document.getElementById('dlg');
function dialogo(titulo, html, onOk, txtOk='Guardar', onInput){
  document.getElementById('dlgTitle').textContent = titulo;
  document.getElementById('dlgBody').innerHTML = html;
  document.getElementById('dlgOk').textContent = txtOk;
  const body = document.getElementById('dlgBody');
  body.oninput = onInput ? () => onInput(body) : null;
  if (onInput) onInput(body);
  // Guardar se aplica en el mismo clic (sin depender del evento "close" del diálogo)
  document.getElementById('dlgOk').onclick = e => { e.preventDefault(); dlg.close('ok'); onOk(body); };
  dlg.onclose = null;
  dlg.returnValue = ''; dlg.showModal();
}
const val = (b,n) => b.querySelector(`[name=${n}]`).value;

function dlgSoloInteres(lid, cid){
  const L = buscarL(lid), c = L.cuotas.find(x => x.id === cid);
  dialogo(`${L.cliente} paga solo interés`, `<div class="form">
    <label>Monto de interés (S/)<input name="m" type="number" step="any" value="${r2(c.interes + moraDe(c))}">${moraDe(c) ? `<span class="hint" style="font-weight:400">Incluye ${money(moraDe(c))} de mora; bórrala si la exoneras.</span>` : ''}</label>
    <label>Fecha de pago<input name="f" type="date" value="${hoy()}"></label>
    <p class="full hint" id="expl" style="margin:0"></p></div>`,
    b => { const s = snapshot(); aplicarSoloInteres(L, c, +val(b,'m')||0, val(b,'f')||hoy()); save(); toast(`${L.cliente}: la deuda se corrió un mes`, s); },
    'Registrar', b => {
      const restantes = pendientes(L).filter(q => q.fecha >= c.fecha);
      b.querySelector('#expl').innerHTML = `Se registra el pago de <b>${money(+val(b,'m')||0)}</b> y las ${restantes.length} cuota(s) pendientes se corren un mes. La cuota de ${money(c.capital+c.interes)} pasa del <b>${fD(c.fecha)}</b> al <b>${fD(addMonths(c.fecha,1,L.dia))}</b>. El préstamo queda en ${L.cuotas.length+1} cuotas (${normales(L).length} normales + ${extrasInteres(L)+1} solo interés).`;
    });
}

/* Editar los datos del préstamo (monto prestado, tasa, fechas, cliente, nota) sin tocar las cuotas. */
function dlgPrestamo(lid){
  const L = buscarL(lid);
  dialogo(`Editar préstamo de ${L.cliente}`, `<div class="form">
    <label>Monto prestado (S/)<input name="cap" type="number" min="0" step="any" value="${L.capital}"></label>
    <label>${L.modo === 'pct' ? 'Interés (%)' : L.modo === 'mes' ? 'Interés por mes (S/)' : 'Interés total (S/)'}<input name="val" type="number" min="0" step="any" value="${L.valor}"></label>
    <label>Fecha en que se prestó<input name="fp" type="date" value="${L.fechaPrestamo || ''}"></label>
    <label>Cliente<input name="cli" value="${esc(L.cliente)}"></label>
    <label>Apodo<input name="apo" value="${esc(L.apodo || '')}"></label>
    <label>Teléfono<input name="tel" value="${esc(L.tel || '')}"></label>
    <label class="full">Fórmula (como en tu nota)<textarea name="fo" rows="2">${esc(L.formula || '')}</textarea></label>
    <label class="full">Nota<textarea name="no" rows="3">${esc(L.nota || '')}</textarea></label>
    <p class="full hint" style="margin:0">Esto cambia los datos del préstamo. Las cuotas (fechas y montos de cada mes) se cambian con <b>Corregir cuotas</b> o con ✎ en cada fila.</p></div>`,
    b => {
      const s = snapshot(), antes = L.capital;
      L.capital = +val(b,'cap') || 0; L.valor = +val(b,'val') || 0; L.fechaPrestamo = val(b,'fp');
      L.cliente = val(b,'cli').trim() || L.cliente; L.apodo = val(b,'apo').trim(); L.tel = val(b,'tel').trim();
      L.formula = val(b,'fo').trim(); L.nota = val(b,'no').trim();
      L.eventos.push({f:hoy(), t:antes !== L.capital ? `Se editó el préstamo (monto ${money(antes)} → ${money(L.capital)})` : 'Se editaron los datos del préstamo'});
      save(); toast('Préstamo actualizado', s);
    });
}
function dlgCuota(lid, cid){
  const L = buscarL(lid), c = L.cuotas.find(x => x.id === cid), tipo = c.fijo ? 'fijo' : c.tipo === 'interes' ? 'interes' : 'normal';
  dialogo(`Editar cuota ${posicion(L,c)} de ${L.cliente}`, `<div class="form">
    <label class="full">Tipo de cuota<select name="t">
      <option value="normal" ${tipo === 'normal' ? 'selected' : ''}>Normal (capital + interés)</option>
      <option value="fijo" ${tipo === 'fijo' ? 'selected' : ''}>Monto fijo (acuerdo, sin cálculo)</option>
      <option value="interes" ${tipo === 'interes' ? 'selected' : ''}>Solo interés</option></select></label>
    <label>Prestado en esta cuota (S/)<input name="sd" type="number" min="0" step="any" value="${c.saldo ?? ''}" placeholder="automático: ${num(saldoAuto(L, c))}"><span class="hint" style="font-weight:400">Solo cambia esta fila. Déjalo vacío para que se calcule solo.</span></label>
    <label>Fecha límite<input name="f" type="date" value="${c.fecha}"></label>
    <label><span id="lblCap">Capital de esta cuota</span><input name="c" type="number" step="any" value="${c.capital}"></label>
    <label>Interés acordado<input name="i" type="number" step="any" value="${intAcord(c)}"></label>
    <label>Interés + (mora / demora)<input name="ia" type="number" step="any" min="0" value="${intAdic(c) || ''}" placeholder="0"></label>
    ${c.pagado ? `<label>Fecha en que pagó<input name="fp" type="date" value="${c.fechaPago || c.fecha}"></label>` : ''}</div>`,
    b => { const s = snapshot(), t = val(b,'t');
      const adic = Math.max(0, +val(b,'ia')||0), sd = val(b,'sd');
      if (sd === '') delete c.saldo; else c.saldo = Math.max(0, +sd || 0);
      c.fecha = val(b,'f') || c.fecha; c.capital = +val(b,'c')||0; c.interes = r2((+val(b,'i')||0) + adic); if (adic) c.mora = adic; else delete c.mora; if (c.pagado) c.fechaPago = val(b,'fp') || c.fechaPago;
      c.tipo = t === 'interes' ? 'interes' : 'normal'; if (t === 'fijo') c.fijo = true; else delete c.fijo;
      L.cuotas.sort((a,b)=>a.fecha.localeCompare(b.fecha)); L.eventos.push({f:hoy(), t:'Se editó una cuota manualmente'}); save(); toast('Cuota actualizada', s); },
    'Guardar', b => { b.querySelector('#lblCap').textContent = val(b,'t') === 'fijo' ? 'Monto fijo (S/)' : 'Capital de esta cuota'; });
}

/* ---------- Toast ---------- */
let tTimer;
function toast(msg, snap){
  const t = document.getElementById('toast'), u = document.getElementById('toastUndo');
  document.getElementById('toastMsg').textContent = msg;
  u.style.display = snap ? '' : 'none';
  u.onclick = () => { S.prestamos = JSON.parse(snap); save(); t.style.display = 'none'; };
  t.style.display = 'flex'; clearTimeout(tTimer); tTimer = setTimeout(() => t.style.display = 'none', 5000);
}

else if (location.hash.startsWith('#c=')) vistaCliente(location.hash.slice(3));
else {

  addEventListener('offline', pintarNube);

}
