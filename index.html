<style>
:root{
  --bg:#f3f6f4; --card:#ffffff; --ink:#1d2a24; --muted:#66756d; --line:#dfe7e2;
  --brand:#2f7d5b; --brand-ink:#ffffff; --brand-soft:#e3f1ea;
  --red:#c2412d; --red-soft:#fbe9e5; --amber:#a86a00; --amber-soft:#fdf2dc;
  --blue:#2b62a8; --blue-soft:#e6eef9; --shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --card:#1b2420; --ink:#e4ece7; --muted:#93a39a; --line:#2c3833;
    --brand:#5cb88f; --brand-ink:#0d1a14; --brand-soft:#1f3a2e;
    --red:#ef7a66; --red-soft:#3a201b; --amber:#e6b450; --amber-soft:#382c14;
    --blue:#7fa9e3; --blue-soft:#1c2a3d; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#121815; --card:#1b2420; --ink:#e4ece7; --muted:#93a39a; --line:#2c3833;
  --brand:#5cb88f; --brand-ink:#0d1a14; --brand-soft:#1f3a2e;
  --red:#ef7a66; --red-soft:#3a201b; --amber:#e6b450; --amber-soft:#382c14;
  --blue:#7fa9e3; --blue-soft:#1c2a3d; --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;font-weight:700;letter-spacing:-.01em}
.top h1 span{color:var(--brand)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--brand-soft);color:var(--brand)}
main{max-width:1100px;margin:0 auto;padding:16px}
h2{font-size:16px;margin:24px 0 10px}
h2 small{color:var(--muted);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
.kpi .l{color:var(--muted);font-size:13px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.list .row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 11px;border-radius:8px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.warn{color:var(--amber)}

.chip.red{background:var(--red-soft);color:var(--red)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.green{background:var(--brand-soft);color:var(--brand)}
.chip.blue{background:var(--blue-soft);color:var(--blue)}
.chip.gray{background:var(--line);color:var(--muted)}
.empty{padding:18px;color:var(--muted);text-align:center}
.grp{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:18px 0 6px}
.grp.red{color:var(--red)}
.loans{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.loan{padding:14px;min-width:0}
.loan .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.loan .hd b{font-size:16px}
.formula{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border-radius:8px;padding:8px 10px;margin:10px 0;line-height:1.6}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--brand)}
.loan .nums{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;font-size:13px;color:var(--muted)}
.loan .nums b{color:var(--ink);font-variant-numeric:tabular-nums}
.loan .acts{margin-top:12px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}

td.n,th.n{text-align:right}
tr.paid td{color:var(--muted)}
tr.late td:first-child{box-shadow:inset 3px 0 0 var(--red)}
.tblwrap{overflow-x:auto}

input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:-1px}

.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 10px}

.banner{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:10px 14px;font-size:13px;font-weight:600;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
dialog{border:0;border-radius:14px;padding:0;background:var(--card);color:var(--ink);width:min(560px,calc(100vw - 32px));box-shadow:0 10px 40px rgba(0,0,0,.25)}

dialog .dh{padding:16px 16px 0;font-weight:700;font-size:16px}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:14px;display:none;gap:12px;align-items:center;z-index:50}
#toast button{background:none;border:0;color:var(--brand-soft);font:inherit;font-weight:700;cursor:pointer;text-decoration:underline}
.sumrow{display:flex;gap:16px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line);font-size:14px}

label.check{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-weight:600;cursor:pointer}
label.check input{width:auto}
table.edit input{padding:5px 6px;min-width:0}
table.edit input[type=number]{width:84px;text-align:right}
table.edit input[type=date]{width:140px}
.adjs{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.adj{width:86px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--bg)}
.adj img,.adj .ico{width:72px;height:72px;object-fit:cover;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:30px}
.adj small{font-size:11px;color:var(--muted);max-width:74px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.adj.add{justify-content:center;font-size:26px;color:var(--brand)}
.viewer img,.viewer video{max-width:100%;max-height:65vh;border-radius:8px;display:block;margin:0 auto}
.chart{padding:16px 12px 12px}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:0;height:100%}
.bval{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;margin-bottom:3px}
.bstack{width:100%;max-width:40px;display:flex;flex-direction:column;border-radius:6px 6px 0 0;overflow:hidden}
.bstack i{display:block}
.bg{background:var(--brand)}
.bp{background:var(--brand-soft);box-shadow:inset 0 0 0 1px var(--brand)}
.blab{font-size:12px;color:var(--muted);margin-top:6px}
.bcol.cur .blab{color:var(--ink);font-weight:700}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px;justify-content:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.nextbox{background:var(--bg);border-radius:10px;padding:12px;margin:12px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.nextbox b{font-size:20px;font-variant-numeric:tabular-nums}

@media (max-width:600px){
  nav{margin-left:0;width:100%}
  nav button{flex:1;padding:8px 4px;font-size:13px}
  .amt{text-align:left;min-width:0}
  .loans{grid-template-columns:1fr}
  table.edit input[type=number]{width:62px}
  table.edit input[type=date]{width:126px}
  table.edit th,table.edit td{padding:5px 4px}
  .kpis{grid-template-columns:1fr 1fr;gap:8px}
  .kpi{padding:10px 12px}
  .kpi .v{font-size:19px}
  main{padding:12px}
}

<body>
<header><div class="top">
  <h1>Belu <span>Bank</span></h1><span id="nubeInd" class="hint" style="font-size:12px;font-weight:600"></span>
  <nav id="nav">
    <button data-v="inicio" class="on">Cobros</button>
    <button data-v="prestamos">Préstamos</button>
    <button data-v="nuevo">+ Nuevo</button>
    <button data-v="ganancias">Ganancias</button>
    <button data-v="respaldo">Respaldo</button>
  </nav>
</div></header>
<main id="app"></main>
<dialog id="dlg"><form method="dialog" id="dlgForm"><div class="dh" id="dlgTitle"></div><div id="dlgBody"></div><div class="df"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn pri" value="ok" id="dlgOk">Guardar</button></div></form></dialog>
<div id="toast"><span id="toastMsg"></span><button id="toastUndo">Deshacer</button></div>
<input type="file" id="fileIn" accept=".json,.zip,application/json,application/zip" hidden>

<script>
/* ================= Datos ================= */
const KEY = 'financiera.v1';
const pad = n => String(n).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoy = () => iso(new Date());
const P = s => { const [y,m,d] = s.split('-').map(Number); return {y,m,d}; };
const uid = () => Math.random().toString(36).slice(2,10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2 = x => Math.round(x*100)/100;

function addMonths(s, k, dia){
  const p = P(s); let m = p.m - 1 + k; const y = p.y + Math.floor(m/12); m = ((m%12)+12)%12;
  const last = new Date(y, m+1, 0).getDate();
  return y+'-'+pad(m+1)+'-'+pad(Math.min(dia || p.d, last));
}
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fD(s){ if(!s) return '—'; const p = P(s); return pad(p.d)+'/'+pad(p.m)+(p.y !== new Date().getFullYear() ? '/'+p.y : ''); }
function money(x){ x = r2(x||0); return 'S/ ' + x.toLocaleString('es-PE', {minimumFractionDigits: Number.isInteger(x)?0:2, maximumFractionDigits:2}); }
const num = x => { x = r2(x||0); return Number.isInteger(x) ? String(x) : x.toFixed(2); };
const daysBetween = (a,b) => Math.round((new Date(b+'T00:00') - new Date(a+'T00:00'))/864e5);

/* Reparte capital e interés en n cuotas: capital redondeado hacia arriba, interés hacia abajo,
   la última cuota ajusta la diferencia (así 2000*20%/3 = 667+133 = 800 cada mes). */
function split(cap, int, n){
  let c = Math.ceil(cap/n); if (c*(n-1) > cap) c = Math.floor(cap/n);
  let i = Math.floor(int/n); if (i*(n-1) > int) i = 0;
  return Array.from({length:n}, (_,k) => k < n-1 ? {capital:c, interes:i} : {capital:r2(cap-c*(n-1)), interes:r2(int-i*(n-1))});
}
function interesDe(modo, base, valor, meses){
  if (modo === 'pct') return r2(base*valor/100);
  if (modo === 'mes') return r2(valor*meses);
  return r2(valor);
}
function formulaDe(modo, base, valor, meses, intTotal, extra){
  const parts = split(base, intTotal, meses)[0];
  let f = modo === 'pct' ? `${num(base)}*${num(valor)}%` : modo === 'mes' ? `${num(base)}cap + ${num(valor)}int/mes` : `${num(base)}cap + ${num(intTotal)}int`;
  if (extra) f = extra + ' → ' + f;
  if (meses > 1) f += (modo === 'mes' ? ` x ${meses}mes` : `/${meses}mes`);
  return f + `\n${num(parts.capital)}cap+${num(parts.interes)}int=${num(parts.capital+parts.interes)}`;
}

function crearPrestamo(o){
  const intTotal = interesDe(o.modo, o.capital, o.valor, o.meses);
  let cuotas, formula = formulaDe(o.modo, o.capital, o.valor, o.meses, intTotal, o.extra);
  if (o.filas?.length){
    // Cuotas elegidas a mano: cada una con su fecha y su monto.
    cuotas = o.filas.map(f => ({id:f.id || uid(), fecha:f.fecha, capital:r2(+f.capital || 0), interes:r2(+f.interes || 0), tipo:f.tipo || 'normal',
      pagado:!!f.pagado, fechaPago:f.pagado ? (f.fechaPago || f.fecha) : null})).sort((a,b) => a.fecha.localeCompare(b.fecha));
    formula = formula.split('\n')[0] + '\ncuotas personalizadas';
  } else {
    const dia = P(o.primera).d;
    cuotas = split(o.capital, intTotal, o.meses).map((p,k) => {
      const fecha = addMonths(o.primera, k, dia), pag = k < (o.pagadas||0);
      return {id:uid(), fecha, capital:p.capital, interes:p.interes, tipo:'normal', pagado:pag, fechaPago: pag ? fecha : null};
    });
  }
  return {id:uid(), cliente:o.cliente.trim(), apodo:(o.apodo||'').trim(), tel:(o.tel||'').trim(), ingreso:+o.ingreso || 0, nota:(o.nota||'').trim(),
    capital:o.capital, modo:o.modo, valor:o.valor, meses:o.meses, interesTotal:r2(cuotas.reduce((s,c) => s + c.interes, 0)), dia:P(cuotas[0]?.fecha || o.primera).d,
    formula, creado:hoy(), cuotas, adjuntos:[], eventos:[{f:hoy(), t:'Préstamo registrado'}]};
}

/* Paga solo el interés de la cuota c: queda registrado ese pago y toda la deuda pendiente se corre un mes. */
function aplicarSoloInteres(L, c, monto, fechaPago){
  const idx = L.cuotas.indexOf(c);
  L.cuotas.forEach((q,j) => { if (j >= idx && !q.pagado) q.fecha = addMonths(q.fecha, 1, L.dia); });
  L.cuotas.splice(idx, 0, {id:uid(), fecha:addMonths(c.fecha,-1,L.dia), capital:0, interes:monto, tipo:'interes', pagado:true, fechaPago});
  L.eventos.push({f:hoy(), t:`Pagó solo interés (${money(monto)}). La deuda se corrió un mes.`});
}
function deshacerSoloInteres(L, q){
  const idx = L.cuotas.indexOf(q);
  L.cuotas.splice(idx,1);
  L.cuotas.forEach((x,j) => { if (j >= idx && !x.pagado) x.fecha = addMonths(x.fecha, -1, L.dia); });
  L.eventos.push({f:hoy(), t:'Se anuló un pago de solo interés'});
}

function seed(){
  // Datos ficticios, con fechas relativas a hoy, solo para mostrar cómo funciona la app.
  const t = hoy();
  const a = crearPrestamo({cliente:'María (ejemplo)', apodo:'Mari', ingreso:2500, capital:1000, modo:'pct', valor:16, meses:2, primera:addMonths(t,0,P(t).d < 25 ? P(t).d+3 : 28), pagadas:0});
  const b = crearPrestamo({cliente:'Juan (ejemplo)', capital:2000, modo:'pct', valor:20, meses:3, primera:addMonths(t,-2,30), pagadas:1});
  aplicarSoloInteres(b, b.cuotas[1], 133, b.cuotas[1].fecha);
  const c = crearPrestamo({cliente:'Pedro y Rosa (ejemplo)', capital:1700, modo:'mes', valor:25, meses:4, primera:addMonths(t,-1,30), pagadas:1,
    extra:'1400cap+500int-200=1700', nota:'Refinanciamiento: el interés no pagado (500) se sumó al capital (1400), menos un abono de 200. Interés simbólico de 25/mes.'});
  return {prestamos:[a,b,c], ultimoRespaldo:null, ejemplo:true};
}

let S, persist = true;
try { const raw = localStorage.getItem(KEY); S = raw ? JSON.parse(raw) : seed(); } catch(e){ S = seed(); persist = false; }
function guardarLocal(){
  if (persist) try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ persist = false; }
}
function save(){
  guardarLocal(); render();
  if (nubeActiva()){ clearTimeout(nube.timer); nube.timer = setTimeout(subirCambios, 600); }
  else if (localStorage.getItem(KEY_NUBE)) try { localStorage.setItem(KEY_SUCIO, '1'); } catch(e){}
  if (S.drive?.auto && GOOGLE_CLIENT_ID){ clearTimeout(syncTimer); syncTimer = setTimeout(() => sincronizarDrive(false), 4000); }
}

/* ================= Cálculos ================= */
const pendientes = L => L.cuotas.filter(c => !c.pagado);
const normales = L => L.cuotas.filter(c => c.tipo === 'normal');
function posicion(L, c){ return (L.cuotas.indexOf(c)+1) + '/' + L.cuotas.length; }
function extrasInteres(L){ return L.cuotas.filter(c => c.tipo === 'interes').length; }
function estadoPrestamo(L){
  const p = pendientes(L);
  if (!p.length) return {t:'Pagado', cls:'green'};
  if (p[0].fecha < hoy()) return {t:'Atrasado', cls:'red'};
  return {t:'Al día', cls:'blue'};
}
function mesKey(s){ return s.slice(0,7); }

/* % de cumplimiento: de las cuotas que ya vencieron (o ya se pagaron), cuántas se pagaron
   completas y a tiempo. Un mes de "solo interés" cuenta como no cumplido. */
function cumplimiento(cuotas){
  const t = hoy();
  const evaluadas = cuotas.filter(c => c.tipo === 'interes' || c.pagado || c.fecha < t);
  if (!evaluadas.length) return null;
  const ok = evaluadas.filter(c => c.tipo === 'normal' && c.pagado && (c.fechaPago || c.fecha) <= c.fecha).length;
  return Math.round(ok / evaluadas.length * 100);
}
const chipCumpl = p => p === null ? '<span class="chip gray">sin historial</span>'
  : `<span class="chip ${p >= 90 ? 'green' : p >= 60 ? 'amber' : 'red'}">${p}% cumplido</span>`;
const mismoCliente = (a, b) => a.trim().toLowerCase() === b.trim().toLowerCase();
const prestamosDe = nombre => S.prestamos.filter(L => mismoCliente(L.cliente, nombre));
const cuotaTipica = L => { const c = L.cuotas.find(c => c.tipo === 'normal'); return c ? c.capital + c.interes : 0; };

/* ================= UI ================= */
let vista = 'inicio', filtro = '', mesHist = hoy().slice(0,7), abiertos = new Set();
const app = document.getElementById('app');
document.getElementById('nav').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.v === 'nuevo' && borrador.editId) borrador = nuevoBorrador(); ir(b.dataset.v); };
function ir(v){ vista = v; document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); render(); window.scrollTo(0,0); }

function render(){
  ({inicio:vInicio, prestamos:vPrestamos, nuevo:vNuevo, ganancias:vGanancias, respaldo:vRespaldo})[vista]();
}

function bannerRespaldo(){
  let h = '';
  if (!persist) h += `<div class="banner">⚠️ Este navegador no permite guardar datos aquí. Usa “Respaldo → Exportar” antes de cerrar.</div>`;
  const u = S.ultimoRespaldo;
  if (persist && !nubeActiva() && (!u || daysBetween(u, hoy()) > 7)) h += `<div class="banner">💾 ${u ? 'Tu último respaldo fue hace '+daysBetween(u,hoy())+' días.' : 'Aún no tienes un respaldo.'} Los datos viven solo en este navegador. <button class="btn sm" onclick="exportarJSON()">Descargar respaldo</button></div>`;
  if (S.drive?.auto && GOOGLE_CLIENT_ID && !Drive.listo()) h += `<div class="banner" style="background:var(--blue-soft);color:var(--blue)">☁ Google Drive está desconectado; tus cambios no se están copiando. <button class="btn sm" onclick="sincronizarDrive(true)">Conectar y guardar</button></div>`;
  if (localStorage.getItem(KEY_NUBE) && nube.sinSesion) h += `<div class="banner" style="background:var(--blue-soft);color:var(--blue)">☁ Tu sesión de la nube se cerró; los cambios no se están sincronizando. <button class="btn sm" onclick="entrarNube()">Entrar con Google</button></div>`;
  if (S.ejemplo) h += `<div class="banner" style="background:var(--blue-soft);color:var(--blue)">Estos préstamos son de ejemplo, para que veas cómo funciona. Cuando quieras, empieza vacío o restaura tu respaldo. <button class="btn sm" onclick="S={prestamos:[],ultimoRespaldo:S.ultimoRespaldo,ejemplo:false};save()">Empezar vacío</button> <button class="btn sm" onclick="document.getElementById('fileIn').click()">Restaurar respaldo</button></div>`;
  return h;
}

function filaCobro(L, c){
  const t = hoy(), atras = c.fecha < t ? daysBetween(c.fecha, t) : 0;
  const ext = extrasInteres(L);
  return `<div class="row">
    <div class="who"><b>${esc(L.cliente)}</b>${L.apodo ? ` <span class="hint">“${esc(L.apodo)}”</span>` : ''} <span class="chip gray">${posicion(L,c)}${ext?` · +${ext} solo int.`:''}</span>
      <div class="meta">Vence ${fD(c.fecha)} ${atras ? `<span class="chip red">${atras} día${atras>1?'s':''} de atraso</span>` : c.fecha===t ? '<span class="chip amber">hoy</span>' : `· faltan ${daysBetween(t,c.fecha)} días`}</div></div>
    <div class="amt"><b>${money(c.capital+c.interes)}</b><div class="meta">${num(c.capital)} cap + ${num(c.interes)} int</div></div>
    <div class="acts">
      <button class="btn pri" onclick="pagar('${L.id}','${c.id}')">✓ Pagó</button>
      <button class="btn warn" onclick="dlgSoloInteres('${L.id}','${c.id}')">Solo interés</button>
      <button class="btn wa" onclick="whatsapp('${L.id}','${c.id}')">WhatsApp</button>
    </div></div>`;
}

function vInicio(){
  const t = hoy(), mes = t.slice(0,7), prox = addMonths(t,1).slice(0,7);
  const items = [];
  S.prestamos.forEach(L => pendientes(L).forEach(c => items.push({L,c})));
  items.sort((a,b) => a.c.fecha.localeCompare(b.c.fecha));
  const atras = items.filter(x => x.c.fecha < t);
  const esteMes = items.filter(x => x.c.fecha >= t && mesKey(x.c.fecha) === mes);
  const proxMes = items.filter(x => mesKey(x.c.fecha) === prox);
  const calle = items.reduce((s,x) => s + x.c.capital, 0);
  const porInt = items.reduce((s,x) => s + x.c.interes, 0);
  const porCobrarMes = [...atras, ...esteMes].reduce((s,x) => s + x.c.capital + x.c.interes, 0);
  let cobradoMes = 0, intMes = 0;
  S.prestamos.forEach(L => L.cuotas.forEach(c => { if (c.pagado && c.fechaPago && mesKey(c.fechaPago) === mes){ cobradoMes += c.capital+c.interes; intMes += c.interes; }}));
  const activos = S.prestamos.filter(L => pendientes(L).length).length;
  const nombreMes = m => { const p = P(m+'-01'); return MESES[p.m-1]; };

  const grupo = (titulo, arr, cls) => arr.length ? `<div class="grp ${cls||''}">${titulo} · ${money(arr.reduce((s,x)=>s+x.c.capital+x.c.interes,0))}</div><div class="card list">${arr.map(x=>filaCobro(x.L,x.c)).join('')}</div>` : '';
  app.innerHTML = bannerRespaldo() + `
  <div class="kpis">
    <div class="kpi"><div class="l">Capital en la calle</div><div class="v">${money(calle)}</div><div class="s">${activos} préstamo${activos!==1?'s':''} activo${activos!==1?'s':''} · +${money(porInt)} de interés por cobrar</div></div>
    <div class="kpi"><div class="l">Por cobrar en ${nombreMes(mes)}</div><div class="v">${money(porCobrarMes)}</div><div class="s">incluye atrasados</div></div>
    <div class="kpi"><div class="l">Cobrado en ${nombreMes(mes)}</div><div class="v">${money(cobradoMes)}</div><div class="s">ganancia (interés): ${money(intMes)}</div></div>
    <div class="kpi ${atras.length?'red':''}"><div class="l">Cuotas atrasadas</div><div class="v">${atras.length}</div><div class="s">${atras.length ? money(atras.reduce((s,x)=>s+x.c.capital+x.c.interes,0))+' vencido' : 'todo en orden'}</div></div>
  </div>
  ${grupo('Atrasados', atras, 'red')}
  ${grupo('Este mes ('+nombreMes(mes)+')', esteMes)}
  ${grupo('Próximo mes ('+nombreMes(prox)+')', proxMes)}
  ${!atras.length && !esteMes.length && !proxMes.length ? '<div class="card empty" style="margin-top:16px">No hay cobros pendientes para este mes ni el próximo. 🎉</div>' : ''}`;
}

function vPrestamos(){
  const q = filtro.toLowerCase();
  const lista = S.prestamos.filter(L => !q || L.cliente.toLowerCase().includes(q) || (L.apodo || '').toLowerCase().includes(q))
    .sort((a,b) => { const pa = pendientes(a)[0], pb = pendientes(b)[0]; if (!pa) return 1; if (!pb) return -1; return pa.fecha.localeCompare(pb.fecha); });
  app.innerHTML = bannerRespaldo() + `<div class="toolbar"><input id="buscar" placeholder="Buscar cliente…" value="${esc(filtro)}"><span class="hint">${S.prestamos.length} préstamos en total</span><span style="flex:1"></span><button class="btn" onclick="exportarExcel()">⬇ Excel</button><button class="btn pri" onclick="ir('nuevo')">+ Nuevo préstamo</button></div>
  <div class="loans">${lista.map(tarjeta).join('') || '<div class="card empty">Sin préstamos.</div>'}</div>`;
  const b = document.getElementById('buscar');
  b.oninput = () => { filtro = b.value; const pos = b.selectionStart; vPrestamos(); const nb = document.getElementById('buscar'); nb.focus(); nb.setSelectionRange(pos,pos); };
}

function tarjeta(L){
  const e = estadoPrestamo(L), pend = pendientes(L), sig = pend[0];
  const totCap = L.cuotas.reduce((s,c)=>s+c.capital,0), pagCap = L.cuotas.filter(c=>c.pagado).reduce((s,c)=>s+c.capital,0);
  const intCobrado = L.cuotas.filter(c=>c.pagado).reduce((s,c)=>s+c.interes,0);
  const ext = extrasInteres(L), nNorm = normales(L).length, nAdj = (L.adjuntos || []).length;
  const abierto = abiertos.has(L.id);
  const todos = prestamosDe(L.cliente), cpTotal = todos.length > 1 ? cumplimiento(todos.flatMap(x => x.cuotas)) : null;
  const pctIng = L.ingreso ? Math.round(cuotaTipica(L) / L.ingreso * 100) : null;
  return `<div class="card loan">
    <div class="hd"><div><b>${esc(L.cliente)}</b>${L.apodo ? ` <span class="hint">“${esc(L.apodo)}”</span>` : ''} ${L.modo==='pct' ? `<span class="hint">(${num(L.valor)}%)</span>` : ''}
      <div class="hint">${sig ? `Cuota ${posicion(L,sig)} · vence ${fD(sig.fecha)}` : 'Préstamo terminado'} · total ${L.cuotas.length}/${L.cuotas.length}${ext ? ` (${nNorm} + ${ext} solo interés)` : ''}</div></div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="chip ${e.cls}">${e.t}</span>${chipCumpl(cumplimiento(L.cuotas))}</div></div>
    <div class="formula">${esc(L.formula).replace(/\n/g,'<br>')}${sig ? ` (${fD(sig.fecha)})` : ''}</div>
    <div class="bar"><i style="width:${totCap ? Math.round(pagCap/totCap*100) : 100}%"></i></div>
    <div class="nums"><span>Capital devuelto <b>${money(pagCap)}</b> de ${money(totCap)}</span><span>Interés cobrado <b>${money(intCobrado)}</b></span></div>
    ${cpTotal !== null ? `<div class="hint" style="margin-top:6px">Cumplimiento con todos sus préstamos (${todos.length}): <b>${cpTotal}%</b></div>` : ''}
    ${L.ingreso ? `<div class="hint" style="margin-top:6px">💼 Gana ${money(L.ingreso)} al mes · la cuota es el <b style="color:var(--${pctIng > 40 ? 'red' : pctIng > 25 ? 'amber' : 'brand'})">${pctIng}%</b> de su ingreso</div>` : ''}
    ${L.tel ? `<div class="hint" style="margin-top:6px">📞 ${esc(L.tel)}</div>` : ''}
    ${L.nota ? `<div class="hint" style="margin-top:6px">📝 ${esc(L.nota)}</div>` : ''}
    <div class="acts">
      <button class="btn" onclick="toggle('${L.id}')">${abierto ? 'Ocultar' : 'Ver cuotas'}${nAdj ? ` · 📎 ${nAdj}` : ''}</button>
      <button class="btn wa" onclick="enviarEstado('${L.id}')">📤 Enviar estado</button>
      <button class="btn" onclick="corregir('${L.id}')">Corregir</button>
      ${pend.length ? `<button class="btn warn" onclick="dlgRefinanciar('${L.id}')">Refinanciar</button>` : ''}
      <button class="btn dan" onclick="eliminar('${L.id}')">Eliminar</button>
    </div>
    ${abierto ? tablaCuotas(L) + panelAdjuntos(L) : ''}
  </div>`;
}
function toggle(id){ abiertos.has(id) ? abiertos.delete(id) : abiertos.add(id); render(); }

function tablaCuotas(L){
  const t = hoy();
  return `<div class="tblwrap" style="margin-top:12px"><table><thead><tr><th>#</th><th>Fecha límite</th><th class="n">Cap.</th><th class="n">Int.</th><th class="n">Total</th><th>Estado</th><th></th></tr></thead><tbody>
  ${L.cuotas.map((c,i) => {
    const late = !c.pagado && c.fecha < t;
    const est = c.pagado ? `<span class="chip green">Pagado ${fD(c.fechaPago)}</span>` : late ? '<span class="chip red">Atrasado</span>' : '<span class="chip gray">Pendiente</span>';
    const acc = c.tipo === 'interes'
      ? `<button class="btn sm" onclick="anularInteres('${L.id}','${c.id}')">Anular</button>`
      : c.pagado ? `<button class="btn sm" onclick="despagar('${L.id}','${c.id}')">Deshacer</button> <button class="btn sm" onclick="dlgCuota('${L.id}','${c.id}')">✎</button>`
      : `<button class="btn sm pri" onclick="pagar('${L.id}','${c.id}')">Pagó</button> <button class="btn sm" onclick="dlgCuota('${L.id}','${c.id}')">✎</button>`;
    return `<tr class="${c.pagado?'paid':''} ${late?'late':''}"><td>${i+1}${c.tipo==='interes'?' <span class="chip amber">solo int.</span>':''}</td><td>${fD(c.fecha)}</td><td class="n">${num(c.capital)}</td><td class="n">${num(c.interes)}</td><td class="n"><b>${num(c.capital+c.interes)}</b></td><td>${est}</td><td style="white-space:nowrap">${acc}</td></tr>`;
  }).join('')}</tbody></table></div>
  ${L.eventos?.length ? `<details style="margin-top:8px"><summary class="hint" style="cursor:pointer">Historial del préstamo (${L.eventos.length})</summary><ul class="hint">${L.eventos.map(e=>`<li>${fD(e.f)} — ${esc(e.t)}</li>`).join('')}</ul></details>` : ''}`;
}

/* ---------- Nuevo préstamo / Corregir ---------- */
const ACCEPT = 'image/*,video/*,application/pdf,.doc,.docx,.xls,.xlsx';
const nuevoBorrador = () => ({cliente:'', apodo:'', tel:'', ingreso:'', capital:1000, modo:'pct', valor:16, meses:2, primera:addMonths(hoy(),1), pagadas:0, nota:'',
  personalizado:false, filas:null, editId:null, archivos:[]});
let borrador = nuevoBorrador();
const generarFilas = () => crearPrestamo({...borrador, cliente:'-', filas:null}).cuotas.map(c => ({fecha:c.fecha, capital:c.capital, interes:c.interes, tipo:'normal', pagado:c.pagado, fechaPago:c.fechaPago}));

function vNuevo(){
  const b = borrador, L0 = b.editId && buscarL(b.editId);

      <option value="pct" ${b.modo==='pct'?'selected':''}>% sobre el capital (total)</option>
      <option value="fijo" ${b.modo==='fijo'?'selected':''}>Monto fijo total (S/)</option>

    <label><span id="lblValor"></span><input name="valor" type="number" min="0" step="any" value="${b.valor}"></label>
    <label>Meses<input name="meses" type="number" min="1" step="1" value="${b.meses}"></label>
    <label>Primera fecha límite<input name="primera" type="date" value="${b.primera}"></label>
    <label id="lblPagadas">Cuotas ya pagadas<input name="pagadas" type="number" min="0" step="1" value="${b.pagadas}"><span class="hint" style="font-weight:400">Para registrar préstamos que ya venían de antes</span></label>
    <label class="full">Nota<textarea name="nota" rows="2" placeholder="Opcional">${esc(b.nota)}</textarea></label>
    <label class="full check"><input type="checkbox" name="personalizado" ${b.personalizado?'checked':''}> Elegir la fecha y el monto de cada cuota</label>
    ${L0 ? '' : `<div class="full"><label class="btn" style="display:inline-flex;flex-direction:row;color:var(--ink)">📎 Adjuntar contrato, fotos o videos<input type="file" multiple hidden accept="${ACCEPT}" id="inArch"></label><div id="listaArch" class="hint" style="margin-top:6px"></div></div>`}
  </div><div class="preview" id="prev"></div>
  <div style="padding:0 16px 16px;display:flex;justify-content:flex-end;gap:8px">
    ${L0 ? `<button class="btn" onclick="borrador=nuevoBorrador();ir('prestamos')">Cancelar</button>` : `<button class="btn" onclick="borrador=nuevoBorrador();vNuevo()">Limpiar</button>`}
    <button class="btn pri" onclick="guardarNuevo()">${L0 ? 'Guardar corrección' : 'Guardar préstamo'}</button></div></div>`;
  const f = document.getElementById('fNuevo');
  f.oninput = e => { if (e.target.id !== 'inArch') { leerBorrador(); previa(); } };
  const inA = document.getElementById('inArch');
  if (inA) inA.onchange = () => { borrador.archivos.push(...inA.files); inA.value = ''; listaArchivos(); };
  listaArchivos(); previa();

function listaArchivos(){
  const el = document.getElementById('listaArch'); if (!el) return;
  el.innerHTML = borrador.archivos.map((a,i) => `<div>📄 ${esc(a.name)} <span class="hint">(${tamano(a.size)})</span> <button class="btn sm dan" type="button" onclick="borrador.archivos.splice(${i},1);listaArchivos()">✕</button></div>`).join('');
}
const tamano = n => n > 1048576 ? (n/1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n/1024)) + ' KB';
function leerBorrador(){
  const f = document.getElementById('fNuevo'), v = n => f.querySelector(`[name=${n}]`).value;
  const pers = f.querySelector('[name=personalizado]').checked;
  Object.assign(borrador, {cliente:v('cliente'), apodo:v('apodo'), tel:v('tel'), ingreso:+v('ingreso')||0, capital:+v('capital')||0, modo:v('modo'), valor:+v('valor')||0,
    meses:Math.max(1,parseInt(v('meses'))||1), primera:v('primera')||hoy(), pagadas:Math.max(0,parseInt(v('pagadas'))||0), nota:v('nota'), personalizado:pers});
  if (pers && !borrador.filas) borrador.filas = generarFilas();
  if (!pers) borrador.filas = null;
}
function previa(){
  const b = borrador, el = document.getElementById('prev');
  document.getElementById('lblValor').textContent = b.modo==='pct' ? 'Porcentaje (%)' : b.modo==='mes' ? 'Interés por mes (S/)' : 'Interés total (S/)';
  document.getElementById('lblPagadas').style.display = b.personalizado ? 'none' : '';
  if (!b.capital || !b.primera){ el.innerHTML = ''; return; }
  if (!b.personalizado){
    const L = crearPrestamo({...b, cliente:b.cliente||'—', filas:null});
    el.innerHTML = `<div class="formula" style="margin-top:0">${esc(L.formula).replace(/\n/g,'<br>')} (${fD(L.cuotas[0].fecha)})</div>
     <div class="hint" style="margin-bottom:8px">Interés total <b>${money(L.interesTotal)}</b> · Te devuelven <b>${money(L.capital + L.interesTotal)}</b> en ${b.meses} cuota${b.meses>1?'s':''}${b.ingreso ? ` · la cuota es el <b>${Math.round(cuotaTipica(L)/b.ingreso*100)}%</b> de su ingreso` : ''}</div>
     <div class="tblwrap"><table><thead><tr><th>#</th><th>Fecha límite</th><th class="n">Capital</th><th class="n">Interés</th><th class="n">Total</th></tr></thead><tbody>
     ${L.cuotas.map((c,i)=>`<tr class="${c.pagado?'paid':''}"><td>${i+1}/${b.meses}</td><td>${fD(c.fecha)}</td><td class="n">${num(c.capital)}</td><td class="n">${num(c.interes)}</td><td class="n"><b>${num(c.capital+c.interes)}</b>${c.pagado?' ✓':''}</td></tr>`).join('')}
     </tbody></table></div>`;
    return;
  }
  el.innerHTML = `<div class="hint" style="margin-bottom:8px">Cambia la fecha, el capital o el interés de cada cuota. Marca “Pagada” en las que ya te pagaron.
     <button class="btn sm" type="button" onclick="borrador.filas=generarFilas();previa()">↺ Volver al cálculo automático</button></div>
   <div class="tblwrap"><table class="edit"><thead><tr><th>#</th><th>Fecha límite</th><th class="n">Capital</th><th class="n">Interés</th><th class="n">Total</th><th>Pagada</th><th></th></tr></thead><tbody id="filas">
   ${b.filas.map((f,i)=>`<tr data-i="${i}"><td>${i+1}${f.tipo==='interes'?' <span class="chip amber">solo int.</span>':''}</td>
     <td><input type="date" data-k="fecha" value="${f.fecha}"></td>
     <td class="n"><input type="number" step="any" data-k="capital" value="${f.capital}"></td>
     <td class="n"><input type="number" step="any" data-k="interes" value="${f.interes}"></td>
     <td class="n" data-tot><b>${num(+f.capital + +f.interes)}</b></td>
     <td style="text-align:center"><input type="checkbox" data-k="pagado" ${f.pagado?'checked':''} style="width:auto"></td>
     <td><button class="btn sm dan" type="button" onclick="borrador.filas.splice(${i},1);previa()">✕</button></td></tr>`).join('')}
   </tbody></table></div>
   <div class="acts" style="margin-top:8px"><button class="btn sm" type="button" onclick="agregarFila()">+ Agregar cuota</button></div>
   <div id="sumas" class="hint" style="margin-top:10px"></div>`;
  document.getElementById('filas').oninput = e => {
    const tr = e.target.closest('tr'), f = b.filas[+tr.dataset.i], k = e.target.dataset.k;
    f[k] = k === 'pagado' ? e.target.checked : k === 'fecha' ? e.target.value : +e.target.value || 0;
    if (k === 'pagado') f.fechaPago = f.pagado ? (f.fechaPago || f.fecha) : null;
    tr.querySelector('[data-tot]').innerHTML = `<b>${num(+f.capital + +f.interes)}</b>`;
    sumas();
  };

}
function sumas(){
  const b = borrador, el = document.getElementById('sumas'); if (!el) return;
  const cap = r2(b.filas.reduce((s,f) => s + (+f.capital||0), 0)), int = r2(b.filas.reduce((s,f) => s + (+f.interes||0), 0));
  const intEsp = interesDe(b.modo, b.capital, b.valor, b.meses);
  el.innerHTML = `Capital <b>${money(cap)}</b> ${cap === r2(b.capital) ? '✓' : `<span class="chip amber">prestaste ${money(b.capital)}</span>`}
    · Interés <b>${money(int)}</b> ${int === intEsp ? '✓' : `<span class="chip amber">con el interés de arriba serían ${money(intEsp)}</span>`}
    · Te devuelven <b>${money(cap + int)}</b> en ${b.filas.length} cuota${b.filas.length !== 1 ? 's' : ''}`;
}
function agregarFila(){
  const u = borrador.filas.at(-1);
  borrador.filas.push({fecha:u ? addMonths(u.fecha, 1) : borrador.primera, capital:0, interes:0, tipo:'normal', pagado:false, fechaPago:null});
  previa();
}
function corregir(lid){
  const L = buscarL(lid);
  borrador = {...nuevoBorrador(), cliente:L.cliente, apodo:L.apodo || '', tel:L.tel, ingreso:L.ingreso || '', capital:L.capital, modo:L.modo, valor:L.valor,
    meses:L.meses, primera:L.cuotas[0]?.fecha || hoy(), nota:L.nota, personalizado:true, filas:L.cuotas.map(c => ({...c})), editId:L.id};
  vista = 'nuevo'; document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === 'nuevo')); render(); window.scrollTo(0,0);
}
async function guardarNuevo(){
  leerBorrador();
  if (!borrador.cliente.trim()) { toast('Escribe el nombre del cliente'); return; }
  if (!borrador.capital) { toast('Escribe el capital'); return; }
  if (borrador.personalizado && !borrador.filas.length) { toast('Agrega al menos una cuota'); return; }
  if (borrador.filas?.some(f => !f.fecha)) { toast('Falta la fecha de alguna cuota'); return; }
  const nuevo = crearPrestamo(borrador), archivos = borrador.archivos, snap = snapshot();
  let L, msg;
  if (borrador.editId){
    L = buscarL(borrador.editId);
    Object.assign(L, {...nuevo, id:L.id, creado:L.creado, adjuntos:L.adjuntos || [], eventos:[...L.eventos, {f:hoy(), t:'Préstamo corregido'}]});

  } else { L = nuevo; S.prestamos.push(L); msg = 'Préstamo guardado'; }
  borrador = nuevoBorrador(); abiertos.add(L.id);
  ir('prestamos'); save(); toast(msg, snap);

}

/* El respaldo es un .json; si hay archivos adjuntos, va dentro de un .zip junto con ellos. */
async function construirRespaldo(){
  const json = JSON.stringify(S, null, 1), metas = S.prestamos.flatMap(L => L.adjuntos || []);
  if (!metas.length) return {blob:new Blob([json], {type:'application/json'}), ext:'json'};
  const files = [{name:'respaldo.json', data:json}];
  for (const m of metas){ const r = await DB.get(m.id); if (r) files.push({name:`adjuntos/${m.id}`, data:new Uint8Array(await r.blob.arrayBuffer())}); }
  return {blob:XLSX.zip(files, 'application/zip'), ext:'zip'};
}
async function exportarJSON(){
  try { const r = await construirRespaldo(); S.ultimoRespaldo = hoy(); descargar(`belu-bank-respaldo-${hoy()}.${r.ext}`, r.blob, r.blob.type); save(); }
  catch(e){ console.error(e); toast('No se pudo crear el respaldo'); }
}
async function unzip(buf){
  const u8 = new Uint8Array(buf), dv = new DataView(buf), out = {};
  let e = u8.length - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) throw new Error('zip');
  let p = dv.getUint32(e + 16, true);
  for (let i = 0, n = dv.getUint16(e + 10, true); i < n; i++){
    const metodo = dv.getUint16(p + 10, true), comp = dv.getUint32(p + 20, true), ln = dv.getUint16(p + 28, true), off = dv.getUint32(p + 42, true);
    const nombre = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + ln));
    const ini = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    let datos = u8.slice(ini, ini + comp);
    if (metodo === 8) datos = new Uint8Array(await new Response(new Blob([datos]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    out[nombre] = datos;
    p += 46 + ln + dv.getUint16(p + 30, true) + dv.getUint16(p + 32, true);
  }
  return out;
}

/* Un .xlsx es un ZIP con archivos XML. Se arma aquí mismo para que funcione sin internet.
   Las fórmulas llevan su resultado ya calculado, así el archivo se ve bien incluso en
   visores que no recalculan (vista previa de WhatsApp o Drive). */
const XLSX = (() => {

  const crc32 = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = T[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };

  function zip(files, type = 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'){
    const parts = [], central = []; let off = 0;
    for (const f of files){
      const name = enc.encode(f.name), data = typeof f.data === 'string' ? enc.encode(f.data) : f.data, crc = crc32(data);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true);
      h.setUint16(12, 0x21, true); h.setUint32(14, crc, true); h.setUint32(18, data.length, true); h.setUint32(22, data.length, true);
      h.setUint16(26, name.length, true);
      parts.push(new Uint8Array(h.buffer), name, data);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
      c.setUint16(14, 0x21, true); c.setUint32(16, crc, true); c.setUint32(20, data.length, true); c.setUint32(24, data.length, true);
      c.setUint16(28, name.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), name);
      off += 30 + name.length + data.length;
    }
    const size = central.reduce((s, a) => s + a.length, 0), e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
    e.setUint32(12, size, true); e.setUint32(16, off, true);
    return new Blob([...parts, ...central, new Uint8Array(e.buffer)], {type});
  }

  const x = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const col = i => { let s = ''; for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s; return s; };

  function sheet(sh, selected){

const serial = s => (Date.UTC(...(p => [p.y, p.m - 1, p.d])(P(s))) - Date.UTC(1899, 11, 30)) / 864e5;
// Excel no acepta textos de más de 255 caracteres dentro de una fórmula: se parten en trozos unidos con &.
const xlText = s => s.match(/[\s\S]{1,200}/g).map(p => '"' + p.replace(/"/g, '""') + '"').join('&');

function construirExcel(){
  const t = hoy();
  const eom = (() => { const p = P(t); return t.slice(0, 8) + pad(new Date(p.y, p.m, 0).getDate()); })();
  const num = new Map(S.prestamos.map((L, i) => [L, i + 1]));
  const filas = [];
  S.prestamos.forEach(L => L.cuotas.forEach(c => filas.push({L, c})));
  filas.sort((a, b) => a.c.fecha.localeCompare(b.c.fecha) || num.get(a.L) - num.get(b.L));
  const n = Math.max(2, filas.length + 1);
  const R = c => `Cuotas!$${c}$2:$${c}$${n}`;
  const situacion = c => c.pagado ? 'Pagado' : c.fecha < t ? 'Atrasado' : c.fecha <= eom ? 'Este mes' : 'Pendiente';
  const H = (txt, gris) => ({v:txt, s:gris ? 8 : 1});

  /* ---- Cuotas ---- */
  const cuotas = [[H('Préstamo N°'), H('Cliente'), H('Cuota'), H('Tipo'), H('Fecha límite'), H('Capital'), H('Interés'), H('Total', 1), H('Estado'), H('Fecha de pago'), H('Días de atraso', 1), H('Situación', 1), H('Recordatorio', 1)]];
  filas.forEach(({L, c}, i) => {
    const r = i + 2, tot = r2(c.capital + c.interes), sit = situacion(c);
    let wa = '';
    if (!c.pagado){
      const venc = c.fecha < t ? `venció el ${fD(c.fecha)}` : `vence el ${fD(c.fecha)}`;
      const msg = `Hola ${L.cliente}, te recuerdo que tu cuota ${posicion(L, c)} de ${money(tot)} ${venc}. ¡Gracias!`;
      let tel = (L.tel || '').replace(/\D/g, ''); if (tel.length === 9) tel = '51' + tel;
      wa = {f:`HYPERLINK(${xlText(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`)},"WhatsApp")`, v:'WhatsApp', s:7};
    }
    cuotas.push([
      {v:num.get(L), s:11}, {v:L.cliente, s:4}, {v:posicion(L, c), s:4}, {v:c.tipo === 'interes' ? 'Solo interés' : 'Normal', s:4},
      {v:serial(c.fecha), s:3}, {v:c.capital, s:2}, {v:c.interes, s:2},
      {f:`F${r}+G${r}`, v:tot, s:2},
      {v:c.pagado ? 'Pagado' : 'Pendiente', s:4}, c.fechaPago ? {v:serial(c.fechaPago), s:3} : {v:'', s:3},
      {f:`IF(I${r}="Pagado","",MAX(0,TODAY()-E${r}))`, v:c.pagado ? '' : Math.max(0, daysBetween(c.fecha, t)), s:11},
      {f:`IF(I${r}="Pagado","Pagado",IF(E${r}<TODAY(),"Atrasado",IF(E${r}<=EOMONTH(TODAY(),0),"Este mes","Pendiente")))`, v:sit, s:4},
      wa,
    ]);
  });

  /* ---- Préstamos ---- */
  const prest = [[H('N°'), H('Cliente'), H('Teléfono'), H('Fórmula (como en la nota)'), H('Capital prestado'), H('Interés total'), H('Cuotas'),
    H('Capital pendiente', 1), H('Interés por cobrar', 1), H('Interés cobrado', 1), H('Próximo vencimiento'), H('Pagadas'), H('Estado'), H('Nota'), H('Apodo'), H('Ingreso mensual'), H('% cumplido')]];
  S.prestamos.forEach((L, i) => {
    const r = i + 2, k = num.get(L), pend = pendientes(L), pag = L.cuotas.filter(c => c.pagado);
    const sum = (arr, f) => r2(arr.reduce((s, c) => s + c[f], 0));
    prest.push([
      {v:k, s:11}, {v:L.cliente, s:4}, {v:L.tel || '', s:4}, {v:(L.formula || '').replace(/\n/g, '  →  '), s:4},
      {v:L.capital, s:2}, {v:sum(L.cuotas, 'interes'), s:2}, {v:L.cuotas.length, s:11},
      {f:`SUMIFS(${R('F')},${R('A')},A${r},${R('I')},"Pendiente")`, v:sum(pend, 'capital'), s:2},
      {f:`SUMIFS(${R('G')},${R('A')},A${r},${R('I')},"Pendiente")`, v:sum(pend, 'interes'), s:2},
      {f:`SUMIFS(${R('G')},${R('A')},A${r},${R('I')},"Pagado")`, v:sum(pag, 'interes'), s:2},
      pend.length ? {v:serial(pend[0].fecha), s:3} : {v:'—', s:4},
      {v:`${pag.length}/${L.cuotas.length}`, s:4}, {v:estadoPrestamo(L).t, s:4}, {v:L.nota || '', s:4},
      {v:L.apodo || '', s:4}, L.ingreso ? {v:L.ingreso, s:2} : {v:'', s:4}, (cp => cp === null ? {v:'—', s:4} : {v:cp / 100, s:12})(cumplimiento(L.cuotas)),
    ]);
  });
  const np = Math.max(2, S.prestamos.length + 1);

  /* ---- Resumen ---- */
  const todas = filas.map(f => f.c);
  const sumWhere = (pred, f) => r2(todas.filter(pred).reduce((s, c) => s + (f === 'tot' ? c.capital + c.interes : c[f]), 0));
  const enMes = (c, m) => c.pagado && c.fechaPago && mesKey(c.fechaPago) === m;
  const mesAct = t.slice(0, 7), anio = +t.slice(0, 4);
  const MESL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  const pagadoMes = `${R('I')},"Pagado",${R('J')},">"&EOMONTH(TODAY(),-1),${R('J')},"<="&EOMONTH(TODAY(),0)`;
  const kpis = [
    ['Capital en la calle', `SUMIFS(${R('F')},${R('I')},"Pendiente")`, sumWhere(c => !c.pagado, 'capital')],
    ['Interés por cobrar', `SUMIFS(${R('G')},${R('I')},"Pendiente")`, sumWhere(c => !c.pagado, 'interes')],
    ['Por cobrar este mes (incluye atrasados)', `SUMIFS(${R('H')},${R('I')},"Pendiente",${R('E')},"<="&EOMONTH(TODAY(),0))`, sumWhere(c => !c.pagado && c.fecha <= eom, 'tot')],
    ['Cobrado este mes', `SUMIFS(${R('H')},${pagadoMes})`, sumWhere(c => enMes(c, mesAct), 'tot')],
    ['Ganancia (interés) este mes', `SUMIFS(${R('G')},${pagadoMes})`, sumWhere(c => enMes(c, mesAct), 'interes')],
    ['Monto atrasado', `SUMIFS(${R('H')},${R('I')},"Pendiente",${R('E')},"<"&TODAY())`, sumWhere(c => !c.pagado && c.fecha < t, 'tot')],
    ['Ganancia total (interés cobrado)', `SUMIFS(${R('G')},${R('I')},"Pagado")`, sumWhere(c => c.pagado, 'interes')],
  ];
  const res = [
    [{v:'Belu Bank · Resumen', s:5}],
    [{v:`Generado desde la app el ${fD(t)}${fD(t).length === 5 ? '/' + anio : ''}. Para restaurar la app usa el respaldo .json, no este archivo.`, s:10}],
    [],
    ...kpis.map(([l, f, v]) => [{v:l, s:4}, {f, v, s:6}]),
    [{v:'Cuotas atrasadas', s:4}, {f:`COUNTIFS(${R('I')},"Pendiente",${R('E')},"<"&TODAY())`, v:todas.filter(c => !c.pagado && c.fecha < t).length, s:11}],
    [{v:'Préstamos activos', s:4}, {f:`COUNTIF('Préstamos'!$M$2:$M$${np},"Al día")+COUNTIF('Préstamos'!$M$2:$M$${np},"Atrasado")`, v:S.prestamos.filter(L => pendientes(L).length).length, s:11}],
    [],
    [{v:'Año', s:9}, {v:anio, s:11}],
    [H('Mes', 1), H('Por cobrar (pendiente)', 1), H('Capital cobrado', 1), H('Interés ganado', 1), H('Total cobrado', 1)],
  ];
  const yRow = res.length - 1, first = res.length + 1;
  MESL.forEach((m, i) => {
    const r = res.length + 1, key = `${anio}-${pad(i + 1)}`;
    const ini = `DATE($B$${yRow},${i + 1},1)`, fin = `EOMONTH(DATE($B$${yRow},${i + 1},1),0)`;
    const rng = c => `${R(c)},">="&${ini},${R(c)},"<="&${fin}`;
    const cap = sumWhere(c => enMes(c, key), 'capital'), int = sumWhere(c => enMes(c, key), 'interes');
    res.push([{v:m, s:4},
      {f:`SUMIFS(${R('H')},${R('I')},"Pendiente",${rng('E')})`, v:sumWhere(c => !c.pagado && mesKey(c.fecha) === key, 'tot'), s:2},
      {f:`SUMIFS(${R('F')},${R('I')},"Pagado",${rng('J')})`, v:cap, s:2},
      {f:`SUMIFS(${R('G')},${R('I')},"Pagado",${rng('J')})`, v:int, s:2},
      {f:`C${r}+D${r}`, v:r2(cap + int), s:2}]);
  });
  const last = res.length;
  res.push([{v:'Total del año', s:9}, ...['B', 'C', 'D', 'E'].map(c => {
    let v = 0; for (let r = first; r <= last; r++) v += res[r - 1][c.charCodeAt(0) - 65].v; return {f:`SUM(${c}${first}:${c}${last})`, v:r2(v), s:6};
  })]);

  const ref = `A2:M${n}`;
  return XLSX.book([
    {name:'Resumen', cols:[38, 20, 16, 16, 16], rows:res, grid:false},
    {name:'Préstamos', cols:[6, 20, 13, 42, 12, 12, 8, 13, 12, 12, 13, 9, 11, 50, 14, 13, 11], rows:prest, freeze:true, headerRow:true, filter:`A1:Q${np}`,
      cf:[{ref:`A2:Q${np}`, rules:[{f:'$M2="Atrasado"', dxf:0}, {f:'$M2="Pagado"', dxf:2}]}]},
    {name:'Cuotas', cols:[9, 20, 8, 12, 12, 12, 12, 12, 11, 12, 9, 11, 12], rows:cuotas, freeze:true, headerRow:true, filter:`A1:M${n}`,
      cf:[{ref, rules:[{f:'$L2="Atrasado"', dxf:0}, {f:'$L2="Este mes"', dxf:1}, {f:'$L2="Pagado"', dxf:2}]}],
      dv:[{ref:`I2:I${n + 200}`, list:['Pendiente', 'Pagado']}, {ref:`D2:D${n + 200}`, list:['Normal', 'Solo interés']}]},
  ]);
}

/* ================= Archivos adjuntos ================= */
/* Contratos, fotos y videos se guardan en IndexedDB (aguanta archivos grandes);
   en los datos del préstamo solo queda la ficha de cada archivo. */
const DB = (() => {
  let conexion;
  const abrir = () => conexion ||= new Promise((ok, mal) => {
    const r = indexedDB.open('belubank', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('adjuntos', {keyPath:'id'});
    r.onsuccess = () => ok(r.result); r.onerror = () => mal(r.error);
  });
  const tx = (modo, fn) => abrir().then(db => new Promise((ok, mal) => {
    const t = db.transaction('adjuntos', modo), req = fn(t.objectStore('adjuntos'));
    t.oncomplete = () => ok(req.result); t.onerror = () => mal(t.error); t.onabort = () => mal(t.error);
  }));
  return {put:o => tx('readwrite', st => st.put(o)), get:id => tx('readonly', st => st.get(id)),
    del:id => tx('readwrite', st => st.delete(id)), keys:() => tx('readonly', st => st.getAllKeys())};
})();
const urlsAdj = new Map();
async function urlAdjunto(id){
  if (urlsAdj.has(id)) return urlsAdj.get(id);
  const r = await DB.get(id); if (!r) return null;
  const u = URL.createObjectURL(r.blob); urlsAdj.set(id, u); return u;
}

    <label class="adj add">＋<small>Agregar</small><input type="file" multiple hidden accept="${ACCEPT}" onchange="subirAdjuntos('${L.id}', this.files)"></label></div>`;

async function subirAdjuntos(lid, files){
  const L = buscarL(lid); if (!L) return;
  L.adjuntos = L.adjuntos || [];
  let n = 0;
  for (const f of [...files]){
    const meta = {id:uid(), nombre:f.name, tipo:f.type || 'application/octet-stream', tam:f.size, fecha:hoy()};
    try { await DB.put({id:meta.id, blob:f}); L.adjuntos.push(meta); n++; }
    catch(e){ console.error(e); toast(`No se pudo guardar ${f.name} (¿falta espacio?)`); }
  }
  if (n){ L.eventos.push({f:hoy(), t:`Se adjuntaron ${n} archivo(s)`}); abiertos.add(L.id); save(); toast(n > 1 ? `${n} archivos guardados` : 'Archivo guardado'); }
}

function borrarAdjunto(lid, id){

/* ================= Estado para el cliente ================= */
/* El enlace lleva dentro (después de #) solo los datos de ese cliente. La parte después de #
   no se envía a ningún servidor; quien abre el enlace ve únicamente esa página. */
const b64u = {
  enc:s => { const b = new TextEncoder().encode(s); let t = ''; for (const x of b) t += String.fromCharCode(x); return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); },
  dec:s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0))),
};
function datosEstado(nombre){
  const ps = prestamosDe(nombre), activos = ps.filter(x => pendientes(x).length), lista = activos.length ? activos : ps.slice(-1);
  return {n:ps[0]?.cliente || nombre, p:lista.map(x => x.cuotas.map(c => [c.fecha, c.capital, c.interes, c.tipo === 'interes' ? 1 : 0, c.pagado ? (c.fechaPago || c.fecha) : 0]))};
}
function enlaceEstado(L){
  return location.origin + location.pathname + '#estado=' + b64u.enc(JSON.stringify({...datosEstado(L.cliente), g:hoy()}));
}
/* Con la nube, cada cliente tiene un enlace fijo (#c=token) que siempre muestra su estado actual. */
function tokenCliente(nombre){
  S.clientes = S.clientes || {};
  const k = nombre.trim().toLowerCase();
  if (!S.clientes[k]){
    let t = ''; for (const x of crypto.getRandomValues(new Uint8Array(18))) t += String.fromCharCode(x);
    S.clientes[k] = {token:btoa(t).replace(/\+/g,'-').replace(/\//g,'_'), nombre};
  }
  return S.clientes[k].token;
}
function enviarEstado(lid){
  const L = buscarL(lid), vivo = nubeActiva();
  let link;
  if (vivo){ link = location.origin + location.pathname + '#c=' + tokenCliente(L.cliente); guardarLocal(); subirCambios(); }
  else link = enlaceEstado(L);
  const msg = vivo ? `Hola ${L.cliente}, en este enlace puedes ver en cualquier momento el estado de tu préstamo con Belu Bank:\n${link}`
    : `Hola ${L.cliente}, aquí puedes ver el estado de tu préstamo con Belu Bank (actualizado al ${fD(hoy())}):\n${link}`;
  let tel = (L.tel||'').replace(/\D/g,''); if (tel.length === 9) tel = '51'+tel;
  window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`, '_blank');
}

function pintarEstado(d, vivo){
  document.title = 'Belu Bank · Estado de cuenta';
  const t = hoy(), MESL = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const largo = s => { const p = P(s); return `${p.d} de ${MESL[p.m-1]} de ${p.y}`; };
  const ps = d.p.map(cs => cs.map(([fecha, capital, interes, ti, fp]) => ({fecha, capital, interes, tipo:ti ? 'interes' : 'normal', pagado:!!fp, fechaPago:fp || null})));
  app.innerHTML = `<h2 style="font-size:20px;margin-top:8px">Hola, ${esc(d.n)} 👋</h2>
  <p class="hint">${vivo ? `Estado de tu cuenta, actualizado al <b>${largo(d.g)}</b>. Esta página se actualiza sola cuando se registra un pago.` : `Este es el estado de tu cuenta al <b>${largo(d.g)}</b>. Si pagaste después de esa fecha, pide un enlace actualizado.`}</p>

   sincroniza entre celular y computadora. El estado de cada cliente con enlace se publica en
   estados/{token}, que solo puede leer quien conoce el token. Reglas de acceso: firestore.rules. */
const FIREBASE = {

  storageBucket:'belu-bank.firebasestorage.app', messagingSenderId:'141238546881', appId:'1:141238546881:web:0b797ca0a73debb23c7f40',

async function cargarFirebase(conSesion){
  if (nube.fb) return nube.fb;
  const [ap, m, a] = await Promise.all(['firebase-app.js', 'firebase-firestore.js', ...(conSesion ? ['firebase-auth.js'] : [])].map(f => import(FB_URL + f)));
  const app = ap.initializeApp(FIREBASE);

}

  nube.error = c === 'auth/unauthorized-domain' ? 'Este sitio no está autorizado en Firebase (Authentication → Settings → Authorized domains).'
    : c === 'auth/operation-not-allowed' || c === 'auth/configuration-not-found' ? 'Falta activar el inicio de sesión con Google en Firebase.'
    : c === 'auth/popup-blocked' ? 'El navegador bloqueó la ventana de Google. Permite ventanas emergentes e inténtalo de nuevo.'
    : c === 'permission-denied' ? 'Firestore rechazó el acceso: revisa que las reglas estén publicadas.'
    : c === 'failed-precondition' || c === 'not-found' ? 'Falta crear la base de datos Firestore en Firebase.'
    : 'No se pudo conectar con la nube' + (c ? ` (${c})` : '') + '.';
  ponerEstadoNube('error'); toast(nube.error);

function cortarNube(){ nube.subs.forEach(f => f()); nube.subs = []; nube.uid = null; nube.email = null; nube.ultimos = new Map(); nube.metaUlt = null; nube.estadosUlt = new Map(); }

const metaDe = () => JSON.stringify({ultimoRespaldo:S.ultimoRespaldo || null, drive:S.drive || null, clientes:S.clientes || {}});
const porCreacion = (a, b) => (a.creado || '').localeCompare(b.creado || '') || a.id.localeCompare(b.id);
async function conectarDatos(u){
  if (nube.uid === u.uid && nube.subs.length) return;
  const {db, m} = nube.fb;
  nube.uid = u.uid; nube.email = u.email; ponerEstadoNube('conectando');
  const col = m.collection(db, 'usuarios', u.uid, 'prestamos'), metaRef = m.doc(db, 'usuarios', u.uid);
  const [snap, metaSnap] = await Promise.all([m.getDocs(col), m.getDoc(metaRef)]);
  const remotos = snap.docs.map(d => JSON.parse(d.data().json));
  nube.ultimos = new Map(snap.docs.map(d => [d.id, d.data().json]));
  nube.metaUlt = metaSnap.exists() ? metaSnap.data().json : null;
  const mismaCuenta = localStorage.getItem(KEY_NUBE) === u.uid, localReal = !S.ejemplo && S.prestamos.length > 0;
  let lista, usarMeta = true;
  if (mismaCuenta && localStorage.getItem(KEY_SUCIO)){
    // Hubo cambios en este equipo sin conexión con la nube: se suben encima de lo que hay allá.
    const porId = new Map(remotos.map(L => [L.id, L])); S.prestamos.forEach(L => porId.set(L.id, L)); lista = [...porId.values()]; usarMeta = false;
  } else if (mismaCuenta || !localReal) lista = remotos;
  else if (!remotos.length){ lista = S.prestamos; usarMeta = false; }
  else if (confirm(`Tu cuenta en la nube ya tiene ${remotos.length} préstamo(s) y este equipo tiene ${S.prestamos.length}.\n\nAceptar: usar los de la nube (se reemplazan los de este equipo).\nCancelar: subir los de este equipo (se reemplazan los de la nube).`)) lista = remotos;
  else { lista = S.prestamos; usarMeta = false; }
  S.prestamos = lista.slice().sort(porCreacion); S.ejemplo = false;
  if (usarMeta && nube.metaUlt) Object.assign(S, JSON.parse(nube.metaUlt));
  localStorage.setItem(KEY_NUBE, u.uid); localStorage.removeItem(KEY_SUCIO);
  guardarLocal(); ponerEstadoNube('ok');
  subirCambios();            // primero se escribe lo local (queda en la caché al instante)…
  escucharCambios(col, metaRef);   // …y después se escuchan los cambios de otros equipos
  if (vista !== 'nuevo' && !dlg.open) render();
}
function escucharCambios(col, metaRef){
  const {m} = nube.fb;
  let primera = true;
  nube.subs = [
    m.onSnapshot(col, snap => {
      if (primera){ primera = false; return; }   // ya se cargó con getDocs
      let cambio = false;
      for (const ch of snap.docChanges()){
        const id = ch.doc.id, i = S.prestamos.findIndex(L => L.id === id);
        if (ch.type === 'removed'){ nube.ultimos.delete(id); if (i >= 0){ S.prestamos.splice(i, 1); cambio = true; } continue; }
        const j = ch.doc.data().json; nube.ultimos.set(id, j);
        if (i < 0){ S.prestamos.push(JSON.parse(j)); cambio = true; }
        else if (JSON.stringify(S.prestamos[i]) !== j){ S.prestamos[i] = JSON.parse(j); cambio = true; }
      }
      if (cambio){ S.prestamos.sort(porCreacion); guardarLocal(); if (vista !== 'nuevo' && !dlg.open) render(); }
    }, errorNube),
    m.onSnapshot(metaRef, doc => {
      if (!doc.exists()) return;
      const j = doc.data().json; nube.metaUlt = j;
      if (j !== metaDe()){ Object.assign(S, JSON.parse(j)); guardarLocal(); }
    }, errorNube),
  ];
}
/* Sube solo lo que cambió: préstamos nuevos o editados, borrados, datos generales y estados de clientes. */
function subirCambios(){
  if (!nubeActiva()) return Promise.resolve();
  const {db, m} = nube.fb, uid = nube.uid, ops = [];
  const actuales = new Map(S.prestamos.map(L => [L.id, JSON.stringify(L)]));
  for (const [id, j] of actuales) if (nube.ultimos.get(id) !== j) ops.push(b => b.set(m.doc(db, 'usuarios', uid, 'prestamos', id), {json:j, actualizado:m.serverTimestamp()}));
  for (const id of nube.ultimos.keys()) if (!actuales.has(id)) ops.push(b => b.delete(m.doc(db, 'usuarios', uid, 'prestamos', id)));
  const meta = metaDe();
  if (meta !== nube.metaUlt) ops.push(b => b.set(m.doc(db, 'usuarios', uid), {json:meta, email:nube.email, actualizado:m.serverTimestamp()}));
  for (const c of Object.values(S.clientes || {})){
    const base = JSON.stringify(datosEstado(c.nombre));
    if (nube.estadosUlt.get(c.token) === base) continue;
    nube.estadosUlt.set(c.token, base);
    const d = JSON.stringify({...JSON.parse(base), g:hoy()});
    ops.push(b => b.set(m.doc(db, 'estados', c.token), {owner:uid, d, actualizado:m.serverTimestamp()}));
  }
  if (!ops.length) return Promise.resolve();
  nube.ultimos = actuales; nube.metaUlt = meta;
  ponerEstadoNube('subiendo');
  const lotes = [];
  for (let i = 0; i < ops.length; i += 400){ const b = m.writeBatch(db); ops.slice(i, i + 400).forEach(f => f(b)); lotes.push(b.commit()); }
  return Promise.all(lotes).then(() => { if (nube.estado === 'subiendo') ponerEstadoNube('ok'); }).catch(errorNube);
}

/* ================= Google Drive ================= */
/* Para activarlo hace falta un "ID de cliente OAuth" de Google Cloud (ver README → Google Drive).
   Usa el permiso drive.file: la app solo ve los archivos que ella misma crea en el Drive. */
const GOOGLE_CLIENT_ID = '';
const Drive = (() => {
  let token = null, vence = 0;
  const API = 'https://www.googleapis.com';
  const cargarGoogle = () => window.google?.accounts?.oauth2 ? Promise.resolve() : new Promise((ok, mal) => {
    const sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client';
    sc.onload = ok; sc.onerror = () => mal(new Error('sin conexión')); document.head.appendChild(sc);
  });
  async function conectar(){
    await cargarGoogle();
    await new Promise((ok, mal) => google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID, scope:'https://www.googleapis.com/auth/drive.file',
      callback:r => { if (r.error) return mal(new Error(r.error)); token = r.access_token; vence = Date.now() + (r.expires_in - 60) * 1000; ok(); },
      error_callback:e => mal(new Error(e.type === 'popup_closed' ? 'cancelado' : e.type)),
    }).requestAccessToken({prompt:S.drive?.permitido ? '' : 'consent'}));
    S.drive = {...(S.drive || {}), permitido:true};
  }
  async function api(url, opt = {}){
    const r = await fetch(API + url, {...opt, headers:{...(opt.headers || {}), Authorization:'Bearer ' + token}});
    if (!r.ok) { const err = new Error('Drive ' + r.status); err.status = r.status; throw err; }
    return r.json();
  }
  async function carpeta(nombre, padre){
    const q = `name='${nombre}' and mimeType='application/vnd.google-apps.folder' and trashed=false` + (padre ? ` and '${padre}' in parents` : '');
    const r = await api(`/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id)`);
    if (r.files.length) return r.files[0].id;
    return (await api('/drive/v3/files?fields=id', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:nombre, mimeType:'application/vnd.google-apps.folder', ...(padre ? {parents:[padre]} : {})})})).id;
  }
  async function subir(nombre, blob, padre){
    const form = new FormData();
    form.append('metadata', new Blob([JSON.stringify({name:nombre, parents:[padre]})], {type:'application/json'}));
    form.append('file', blob);
    return (await api('/upload/drive/v3/files?uploadType=multipart&fields=id', {method:'POST', body:form})).id;
  }
  // Reemplaza el contenido del archivo si ya existe; si fue borrado del Drive, crea uno nuevo.
  async function guardar(nombre, blob, padre, id){
    if (id) try { return (await api(`/upload/drive/v3/files/${id}?uploadType=media&fields=id`, {method:'PATCH', body:blob})).id; }
      catch(e){ if (e.status !== 404) throw e; }
    return subir(nombre, blob, padre);
  }
  return {conectar, listo:() => !!token && Date.now() < vence, carpeta, subir, guardar};
})();
let syncTimer = null, sincronizando = false;
async function sincronizarDrive(interactivo){
  if (!GOOGLE_CLIENT_ID || sincronizando) return;
  if (!Drive.listo() && !interactivo) { if (vista === 'inicio' || vista === 'prestamos') render(); return; }
  const btn = () => document.getElementById('btnDrive');
  sincronizando = true; if (btn()) btn().textContent = 'Guardando…';
  try {
    if (!Drive.listo()) await Drive.conectar();
    const d = S.drive = {...(S.drive || {})}; d.ids = d.ids || {};
    const raiz = await Drive.carpeta('Belu Bank');
    const faltan = S.prestamos.flatMap(L => (L.adjuntos || []).filter(m => !m.drive).map(m => ({L, m})));
    if (faltan.length){
      const carp = await Drive.carpeta('Adjuntos', raiz);
      for (const {L, m} of faltan){ const r = await DB.get(m.id); if (r) m.drive = await Drive.subir(`${L.cliente} - ${m.nombre}`, r.blob, carp); }
    }
    d.ids.json = await Drive.guardar('belu-bank-respaldo.json', new Blob([JSON.stringify(S, null, 1)], {type:'application/json'}), raiz, d.ids.json);
    d.ids.xlsx = await Drive.guardar('Belu Bank.xlsx', construirExcel(), raiz, d.ids.xlsx);
    d.ultimo = new Date().toISOString(); S.ultimoRespaldo = hoy();
    guardarLocal(); render();
    if (interactivo) toast('Guardado en Google Drive ✓');
  } catch(e){ console.error(e); toast('No se pudo guardar en Drive' + (e.message ? ` (${e.message})` : '')); }
  finally { sincronizando = false; if (btn()) btn().textContent = '☁ Guardar en Drive ahora'; }
}

function dlgCuota(lid, cid){
  const L = buscarL(lid), c = L.cuotas.find(x => x.id === cid);
  dialogo(`Editar cuota ${posicion(L,c)} de ${L.cliente}`, `<div class="form">
    <label>Fecha límite<input name="f" type="date" value="${c.fecha}"></label>
    <label>Capital<input name="c" type="number" step="any" value="${c.capital}"></label>
    <label>Interés<input name="i" type="number" step="any" value="${c.interes}"></label>
    ${c.pagado ? `<label>Fecha en que pagó<input name="fp" type="date" value="${c.fechaPago || c.fecha}"></label>` : ''}</div>`,
    b => { const s = snapshot(); c.fecha = val(b,'f') || c.fecha; c.capital = +val(b,'c')||0; c.interes = +val(b,'i')||0; if (c.pagado) c.fechaPago = val(b,'fp') || c.fechaPago;
      L.cuotas.sort((a,b)=>a.fecha.localeCompare(b.fecha)); L.eventos.push({f:hoy(), t:'Se editó una cuota manualmente'}); save(); toast('Cuota actualizada', s); });
}

function dlgRefinanciar(lid){
  const L = buscarL(lid), pend = pendientes(L);
  const capPend = r2(pend.reduce((s,c)=>s+c.capital,0)), intPend = r2(pend.reduce((s,c)=>s+c.interes,0));
  const prox = pend[0].fecha < hoy() ? addMonths(hoy(),1,L.dia) : pend[0].fecha;
  dialogo(`Refinanciar a ${L.cliente}`, `<div class="form">
    <label>Capital pendiente<input name="cap" type="number" step="any" value="${capPend}"></label>
    <label>Interés no pagado que se suma<input name="ia" type="number" step="any" value="${intPend}"></label>
    <label>Abono / descuento (se resta)<input name="ab" type="number" step="any" value="0"></label>
    <label>Nuevos meses<input name="m" type="number" min="1" step="1" value="${pend.length}"></label>
    <label>Nuevo interés<select name="mo"><option value="mes">Monto fijo por mes (S/)</option><option value="fijo">Monto fijo total (S/)</option><option value="pct">% sobre la nueva base</option></select></label>
    <label>Valor<input name="v" type="number" step="any" value="25"></label>
    <label>Primera fecha límite<input name="f" type="date" value="${prox}"></label>
    <div class="full" id="rprev"></div></div>`,
    b => {
      const o = leerRefi(b); if (!o) return;
      L.cuotas = L.cuotas.filter(c => c.pagado);
      const nuevo = crearPrestamo({cliente:L.cliente, capital:o.base, modo:o.modo, valor:o.valor, meses:o.meses, primera:o.primera, extra:o.extra});
      L.cuotas.push(...nuevo.cuotas); L.dia = nuevo.dia; L.formula = nuevo.formula;
      L.eventos.push({f:hoy(), t:`Refinanciado: ${o.extra}, ${o.meses} meses`});
      save(); toast(`${L.cliente} refinanciado`);
    }, 'Refinanciar', b => {
      const o = leerRefi(b), el = b.querySelector('#rprev');
      if (!o) { el.innerHTML = ''; return; }
      const n = crearPrestamo({cliente:'x', capital:o.base, modo:o.modo, valor:o.valor, meses:o.meses, primera:o.primera, extra:o.extra});
      el.innerHTML = `<div class="formula" style="margin:0">${esc(n.formula).replace(/\n/g,'<br>')} (${fD(n.cuotas[0].fecha)})</div><p class="hint">Las cuotas pendientes actuales se reemplazan; los pagos ya hechos se conservan.</p>`;
    });
}
function leerRefi(b){
  const cap = +val(b,'cap')||0, ia = +val(b,'ia')||0, ab = +val(b,'ab')||0, meses = Math.max(1,parseInt(val(b,'m'))||1);
  const base = r2(cap+ia-ab); if (base <= 0 || !val(b,'f')) return null;
  return {base, meses, modo:val(b,'mo'), valor:+val(b,'v')||0, primera:val(b,'f'), extra:`${num(cap)}cap+${num(ia)}int${ab?'-'+num(ab):''}=${num(base)}`};
}

/* ---------- Toast ---------- */
let tTimer;
function toast(msg, snap){
  const t = document.getElementById('toast'), u = document.getElementById('toastUndo');
  document.getElementById('toastMsg').textContent = msg;
  u.style.display = snap ? '' : 'none';
  u.onclick = () => { S.prestamos = JSON.parse(snap); save(); t.style.display = 'none'; };
  t.style.display = 'flex'; clearTimeout(tTimer); tTimer = setTimeout(() => t.style.display = 'none', 5000);
}

if (location.hash.startsWith('#estado=')) vistaEstado();
else if (location.hash.startsWith('#c=')) vistaCliente(location.hash.slice(3));
else {
  render();
  if (localStorage.getItem(KEY_NUBE)) iniciarNube();
  addEventListener('online', () => { pintarNube(); if (localStorage.getItem(KEY_NUBE) && !nube.fb) iniciarNube(); });
  addEventListener('offline', pintarNube);
  if (persist) try { if (!localStorage.getItem(KEY)) localStorage.setItem(KEY, JSON.stringify(S)); else limpiarAdjuntos(); } catch(e){}
}
window.addEventListener('hashchange', () => location.reload());
// Pide al navegador no borrar los datos aunque falte espacio, y deja la app disponible sin internet.
if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
